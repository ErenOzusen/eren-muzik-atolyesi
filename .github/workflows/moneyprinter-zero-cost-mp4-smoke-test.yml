name: MoneyPrinterTurbo Zero-Cost MP4 Smoke Test

"on":
  pull_request:
    paths:
      - ".github/workflows/moneyprinter-zero-cost-mp4-smoke-test.yml"
      - ".github/scripts/moneyprinter_payload_adapter.py"
      - ".github/config/faceless-execution-safety.json"
      - ".github/config/video-orchestrator.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-cost-local-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Üretim güvenlik kilitlerini doğrula
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.generation_dispatch_enabled == false' .github/config/video-orchestrator.json >/dev/null
          jq -e '
            .engine == "moneyprinterturbo" and
            .dry_run_only == true and
            .allow_network_generation_calls == false and
            .hard_max_cost_usd == 0
          ' .github/config/faceless-execution-safety.json >/dev/null

      - name: Yerel sentetik test medyasını oluştur
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:s=720x1280:d=4:r=30" \
            -vf "drawtext=text='ZERO COST FACELESS TEST':fontcolor=white:fontsize=42:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -pix_fmt yuv420p \
            /tmp/local-input.mp4
          test -s /tmp/local-input.mp4

      - name: Güvenli MoneyPrinter payload üret
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/approved-script.md <<'EOF'
          Bu, gerçek kullanıcı içeriği olmayan sıfır maliyetli bir faceless MP4 smoke testidir.
          Hazır senaryo korunur; harici LLM, stok medya, ücretli TTS veya yayın servisi çağrılmaz.
          EOF

          python3 .github/scripts/moneyprinter_payload_adapter.py \
            --script-file /tmp/approved-script.md \
            --output-file /tmp/mpt-payload.json \
            --aspect 9:16 \
            --local-media /tmp/local-input.mp4

          jq -e '
            .video_source == "local" and
            (.video_materials | length) == 1 and
            .video_materials[0].url == "/tmp/local-input.mp4" and
            .voice_name == "no-voice" and
            .bgm_type == "" and
            .bgm_volume == 0 and
            .subtitle_enabled == false and
            .video_count == 1
          ' /tmp/mpt-payload.json >/dev/null

      - name: MoneyPrinterTurbo v1.3.5 kur
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.5 https://github.com/harry0703/MoneyPrinterTurbo.git /tmp/mpt
          cd /tmp/mpt

          python3 -m pip install --disable-pip-version-check -q uv
          uv sync --frozen --python 3.11

          cp -n config.example.toml config.toml || true
          .venv/bin/python cli.py --help >/dev/null

      - name: Gerçek MP4 üretimini ağ kapalıyken çalıştır
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mpt

          SCRIPT="$(cat /tmp/approved-script.md)"

          cleanup_firewall() {
            sudo iptables -D OUTPUT -j REJECT 2>/dev/null || true
          }
          trap cleanup_firewall EXIT

          # Tüm bağımlılıklar kurulduktan sonra üretim aşamasında harici ağ çağrısını
          # teknik olarak da engelle. Yerel FFmpeg/MoviePy akışı çalışmaya devam eder.
          sudo iptables -I OUTPUT 1 -j REJECT

          set +e
          .venv/bin/python cli.py \
            --video-script "$SCRIPT" \
            --video-source local \
            --video-materials "/tmp/local-input.mp4" \
            --video-aspect 9:16 \
            --voice-name no-voice \
            --bgm-type none \
            --no-subtitle-enabled \
            --stop-at video \
            > /tmp/mpt-run.log 2>&1
          RC=$?
          set -e

          cleanup_firewall
          trap - EXIT

          if [[ $RC -ne 0 ]]; then
            tail -n 120 /tmp/mpt-run.log
            exit $RC
          fi

          FINAL_VIDEO="$(find /tmp/mpt -type f -name 'final-*.mp4' -size +10k -print -quit)"
          if [[ -z "$FINAL_VIDEO" ]]; then
            echo "MoneyPrinterTurbo final MP4 bulunamadı."
            tail -n 120 /tmp/mpt-run.log
            exit 1
          fi

          cp "$FINAL_VIDEO" /tmp/moneyprinter-zero-cost-smoke.mp4

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/moneyprinter-zero-cost-smoke.mp4)"
          python3 - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if duration < 2.0:
              raise SystemExit(f"MP4 süresi beklenenden kısa: {duration}")
          print(f"MP4 duration OK: {duration:.2f}s")
          PY

          test -s /tmp/moneyprinter-zero-cost-smoke.mp4

      - name: MP4 artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinter-zero-cost-smoke-mp4
          path: /tmp/moneyprinter-zero-cost-smoke.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Güvenli sonuç özeti
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### MoneyPrinterTurbo Zero-Cost MP4 Smoke Test"
            echo "- Engine: MoneyPrinterTurbo v1.3.5"
            echo "- Kaynak medya: sentetik ve tamamen yerel"
            echo "- Hazır senaryo: evet"
            echo "- LLM çağrısı: 0"
            echo "- Stok medya API çağrısı: 0"
            echo "- TTS provider çağrısı: 0"
            echo "- BGM provider çağrısı: 0"
            echo "- Üretim sırasında outbound network: firewall ile kapalı"
            echo "- Gerçek MP4: oluşturuldu"
            echo "- YouTube/publication: yapılmadı"
            echo "- Repository production flags: değiştirilmedi"
            echo "- Hard cost cap: 0 USD"
          } >> "$GITHUB_STEP_SUMMARY"
