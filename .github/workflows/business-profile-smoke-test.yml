      - ".github/scripts/video_orchestrator.py"
      - ".github/config/video-orchestrator.json"

permissions:
  contents: read

jobs:
  validate-business-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Isletme profili fixture'larini sifir-token dogrula
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_validate_business_config.py
          node .github/scripts/test_build_filming_package_prompt.mjs
          node .github/scripts/test_build_editing_package_prompt.mjs
          python3 .github/scripts/test_output_contract.py
          python3 .github/scripts/test_build_subtitle_package.py
          python3 .github/scripts/test_build_thumbnail_package.py
          python3 .github/scripts/test_build_youtube_package.py
          node .github/scripts/test_youtube_publication_approval_portability.mjs
          node .github/scripts/test_publication_approval_invalidation_phase1.mjs
          python3 .github/scripts/test_build_system_audit.py
          node .github/scripts/test_final_technical_decision_portability.mjs
          node .github/scripts/test_raw_video_intake_portability.mjs
          python3 .github/scripts/test_vibeframe_project_adapter.py
          node .github/scripts/test_runtime_message_portability.mjs
          node .github/scripts/test_legacy_workflow_cleanup.mjs
          node .github/scripts/test_owner_approval_portability.mjs
          node .github/scripts/test_owner_approval_fail_closed_hardening.mjs
          node .github/scripts/test_manual_package_owner_authorization_portability.mjs
          node .github/scripts/test_owner_label_migration_phase1.mjs
          node .github/scripts/test_production_selection_label_migration_phase1.mjs
          node .github/scripts/test_production_readiness_label_migration_phase1.mjs
          node .github/scripts/test_filming_package_label_migration_phase1.mjs
          node .github/scripts/test_gate_orchestrator_state_machine_invariants.mjs
          node .github/scripts/test_gate_orchestrator_e2e_readiness_contract.mjs
          node .github/scripts/test_filming_package_live_label_validation.mjs
          node .github/scripts/test_quality_control_portability.mjs
          node .github/scripts/test_weekly_quality_control_router_migration.mjs
          node .github/scripts/test_script_correction_portability.mjs
          node .github/scripts/test_second_business_portability.mjs
          python3 .github/scripts/test_cost_guard.py
          node .github/scripts/test_editing_package_hardening.mjs
          node .github/scripts/test_subtitle_package_hardening.mjs
          node .github/scripts/test_thumbnail_package_hardening.mjs
          node .github/scripts/test_youtube_publication_package_hardening.mjs
          python3 .github/scripts/test_ai_router.py
          node .github/scripts/test_cost_guard_router_integration.mjs
          node .github/scripts/test_cost_guard_router_integration_phase2.mjs
          python3 .github/scripts/test_router_cost_guard_integration_scenarios.py
          node .github/scripts/test_ci_master_gate.mjs
          python3 .github/scripts/test_repo_safety_scan.py
          node .github/scripts/test_editing_package_test_mode_isolation.mjs
          node .github/scripts/test_pipeline_test_mode_matrix.mjs
          node .github/scripts/test_weekly_content_research_router_migration.mjs
          node .github/scripts/test_weekly_script_agent_router_migration.mjs
          node .github/scripts/test_weekly_script_correction_router_migration.mjs
          node .github/scripts/test_final_technical_check_router_migration.mjs
          node .github/scripts/test_editing_package_router_migration.mjs
          node .github/scripts/test_production_ai_consolidation_audit.mjs

      - name: Sifir-token tam zincir E2E testini calistir
        shell: bash
        run: node .github/scripts/test_zero_token_full_e2e.mjs

      - name: Sifir-token ozetini yaz
        shell: bash
        run: |
          {
            echo "### Business Profile Smoke Test"
            echo "- Mevcut profil: gecti"
            echo "- Ikinci sahte isletme profili: gecti"
            echo "- Negatif fixture'lar: reddedildi"
            echo "- Harici paket: yok"
            echo "- Ag istegi: 0"
            echo "- AI kullanimi: 0 token"
            echo "- Issue yazimi: yok"
          } >> "$GITHUB_STEP_SUMMARY"
