name: Business Profile Zero-Token Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/config/business-profile.json"
      - ".github/scripts/validate_business_config.py"
      - ".github/scripts/test_validate_business_config.py"
      - ".github/scripts/build_filming_package_prompt.mjs"
      - ".github/scripts/test_build_filming_package_prompt.mjs"
      - ".github/scripts/build_editing_package_prompt.mjs"
      - ".github/scripts/test_build_editing_package_prompt.mjs"
      - ".github/config/contracts/filming-package.json"
      - ".github/scripts/output_contract.py"
      - ".github/scripts/test_output_contract.py"
      - ".github/scripts/build_subtitle_package.py"
      - ".github/scripts/test_build_subtitle_package.py"
      - ".github/scripts/build_thumbnail_package.py"
      - ".github/scripts/test_build_thumbnail_package.py"
      - ".github/scripts/build_youtube_package.py"
      - ".github/scripts/test_build_youtube_package.py"
      - ".github/scripts/test_youtube_publication_approval_portability.mjs"
      - ".github/scripts/test_publication_approval_invalidation_phase1.mjs"
      - ".github/scripts/build_system_audit.py"
      - ".github/scripts/test_build_system_audit.py"
      - ".github/scripts/final_technical_decision_contract.mjs"
      - ".github/scripts/test_final_technical_decision_portability.mjs"
      - ".github/scripts/test_raw_video_intake_portability.mjs"
      - ".github/scripts/vibeframe_project_adapter.py"
      - ".github/scripts/test_vibeframe_project_adapter.py"
      - ".github/scripts/test_runtime_message_portability.mjs"
      - ".github/scripts/test_legacy_workflow_cleanup.mjs"
      - ".github/scripts/test_owner_approval_portability.mjs"
      - ".github/scripts/test_manual_package_owner_authorization_portability.mjs"
      - ".github/scripts/test_owner_label_migration_phase1.mjs"
      - ".github/scripts/test_quality_control_portability.mjs"
      - ".github/scripts/test_script_correction_portability.mjs"
      - ".github/scripts/fixtures/**"
      - ".github/workflows/filming-package-agent-v4-router.yml"
      - ".github/workflows/editing-package-agent.yml"
      - ".github/workflows/subtitle-package-agent.yml"
      - ".github/workflows/thumbnail-package-agent.yml"
      - ".github/workflows/youtube-publication-package-agent.yml"
      - ".github/workflows/youtube-publication-approval-gate.yml"
      - ".github/workflows/publication-approval-invalidation-gate.yml"
      - ".github/workflows/system-status-cost-agent.yml"
      - ".github/workflows/final-technical-check.yml"
      - ".github/workflows/raw-video-intake-gate.yml"
      - ".github/workflows/business-config-agent.yml"
      - ".github/workflows/filming-handoff-gate.yml"
      - ".github/workflows/eren-approval-gate.yml"
      - ".github/workflows/approval-invalidation-gate.yml"
      - ".github/workflows/eren-production-selection-gate.yml"
      - ".github/workflows/weekly-quality-control.yml"
      - ".github/workflows/weekly-script-correction.yml"
      - ".github/workflows/business-profile-smoke-test.yml"

permissions:
  contents: read

jobs:
  validate-business-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Isletme profili fixture'larini sifir-token dogrula
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_validate_business_config.py
          node .github/scripts/test_build_filming_package_prompt.mjs
          node .github/scripts/test_build_editing_package_prompt.mjs
          python3 .github/scripts/test_output_contract.py
          python3 .github/scripts/test_build_subtitle_package.py
          python3 .github/scripts/test_build_thumbnail_package.py
          python3 .github/scripts/test_build_youtube_package.py
          node .github/scripts/test_youtube_publication_approval_portability.mjs
          node .github/scripts/test_publication_approval_invalidation_phase1.mjs
          python3 .github/scripts/test_build_system_audit.py
          node .github/scripts/test_final_technical_decision_portability.mjs
          node .github/scripts/test_raw_video_intake_portability.mjs
          python3 .github/scripts/test_vibeframe_project_adapter.py
          node .github/scripts/test_runtime_message_portability.mjs
          node .github/scripts/test_legacy_workflow_cleanup.mjs
          node .github/scripts/test_owner_approval_portability.mjs
          node .github/scripts/test_manual_package_owner_authorization_portability.mjs
          node .github/scripts/test_owner_label_migration_phase1.mjs
          node .github/scripts/test_quality_control_portability.mjs
          node .github/scripts/test_script_correction_portability.mjs

      - name: Sifir-token ozetini yaz
        shell: bash
        run: |
          {
            echo "### Business Profile Smoke Test"
            echo "- Mevcut profil: gecti"
            echo "- Ikinci sahte isletme profili: gecti"
            echo "- Negatif fixture'lar: reddedildi"
            echo "- Harici paket: yok"
            echo "- Ag istegi: 0"
            echo "- AI kullanimi: 0 token"
            echo "- Issue yazimi: yok"
          } >> "$GITHUB_STEP_SUMMARY"
