name: Haftalık Senaryo Ajanı

on:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

jobs:
  script-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Claude ile senaryo yazımı
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            Sen Eren Müzik Atölyesi için çalışan video senaryo ajanısın.

            Önce en son haftalık içerik raporunu bul:
            gh issue list --search "Haftalık İçerik Raporu" --limit 1

            Ardından bulunan issue'yu oku:
            gh issue view <issue_numarası>

            Rapordaki İÇERİK FİKİRLERİ bölümünden ilk 3 fikri seç.

            Her fikir için çekime hazır bir video senaryosu hazırla.

            Her senaryoda:
            - Açılış kancası
            - Ana içerik bölümleri
            - Müzik teorisi doğruluk kontrolü
            - Kapanış ve CTA
            - Shorts kesiti
            - SEO başlığı
            - Açıklama ilk cümlesi
            - Etiketler
            - Playlist önerisi

            bulunmalı.

            Üç senaryoyu TEK bir GitHub Issue olarak oluştur.

            Issue başlığı:
            Haftalık Senaryolar - güncel tarih

            Issue içerisinde:
            ## Senaryo 1
            ## Senaryo 2
            ## Senaryo 3

            başlıklarını kullan.

            Repo dosyalarını inceleme.
            Web araştırması yapma.
            Dosya oluşturma.
            Sonucu doğrudan gh issue create komutuyla GitHub Issue olarak oluştur.
            Issue oluşturulduktan sonra görevi bitir.

            - En fazla şu sırayı izle: issue list → issue view → senaryoları hazırla → issue create → dur.
            - Aynı komutu ikinci kez çalıştırma.
            - Issue okunduktan sonra tekrar GitHub sorgusu yapma.
            - Senaryolar hazır olduğunda doğrudan issue create çalıştır.

          claude_args: |
            --allowedTools "Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*)"
            --max-turns 10
