name: Haftalık Senaryo Ajanı

on:
  schedule:
    # Her Salı Türkiye saatiyle 08:00 (UTC 05:00) - rapordan 1 gün sonra
    - cron: '0 5 * * 2'
  workflow_dispatch: {}

jobs:
  script-writer:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Claude ile senaryo yazımı
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true

          prompt: |
            Sen Eren Müzik Atölyesi için çalışan bir video senaryo yazarı ve
            kalite kontrol asistanısın. Eren; gitar, piyano, bas gitar ve
            müzik teorisi dersleri veren bir müzik öğretmeni.

            ADIM 1:
            `gh issue list --search "Haftalık İçerik Raporu" --limit 1`
            komutuyla en son haftalık içerik raporunu bul.

            Ardından:
            `gh issue view <numara>`
            komutuyla raporun içeriğini oku.

            ADIM 2:
            Rapordaki "İÇERİK FİKİRLERİ" bölümünden öncelik sırasına göre
            ilk 3 fikri seç.

            ADIM 3:
            Her fikir için çekime hazır bir video senaryosu oluştur.

            Her senaryoda:
            - Açılış kancası
            - Ana içerik bölümleri
            - Müzik teorisi doğruluk kontrolü
            - Kapanış ve CTA
            - Shorts kesiti önerisi
            - SEO başlığı
            - Açıklama ilk cümlesi
            - Etiketler
            - Playlist önerisi

            bulunmalı.

            ADIM 4:
            Üç senaryonun tamamını tek bir GitHub Issue olarak oluştur.

            Başlık:
            "Haftalık Senaryolar - güncel tarih"

            Her senaryoyu ayrı başlık altında yaz:
            ## Senaryo 1
            ## Senaryo 2
            ## Senaryo 3

            GitHub Issue başarıyla oluşturulduktan sonra
            başka hiçbir işlem yapma ve görevi bitir.

          claude_args: |
            --allowedTools "Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*)"
            --max-turns 12
