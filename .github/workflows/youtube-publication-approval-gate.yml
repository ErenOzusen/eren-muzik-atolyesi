name: YouTube Son Yayın Onay Kapısı

"on":
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: youtube-publication-approval-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve-publication:
    if: >-
      github.event.issue.pull_request == null &&
      (startsWith(github.event.issue.title, 'YouTube Yayın Paketi') ||
      startsWith(github.event.issue.title, 'TEST YouTube Yayın Paketi'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: İşletme sahibinin son yayın onayını doğrula ve kaydet
        shell: bash
        run: |
          set -euo pipefail

          PROFILE=.github/config/business-profile.json
          EXPECTED_OWNER=$(jq -r '.business.github_owner' "$PROFILE")
          OWNER_DISPLAY_NAME=$(jq -r '.business.owner_display_name' "$PROFILE")
          PRODUCTION_COMMAND=$(jq -r '.approval.production_command' "$PROFILE")
          TEST_COMMAND=$(jq -r '.approval.test_command' "$PROFILE")

          if [[ "$COMMENT_AUTHOR" != "$EXPECTED_OWNER" ]]; then
            echo "Onay komutu yetkili işletme sahibi tarafından yazılmadı: $COMMENT_AUTHOR"
            exit 0
          fi

          gh issue view "$ISSUE_NUMBER" \
            --json title,body,url,state,labels > /tmp/youtube-package.json

          ISSUE_TITLE=$(jq -r '.title' /tmp/youtube-package.json)
          ISSUE_URL=$(jq -r '.url' /tmp/youtube-package.json)
          jq -r '.body' /tmp/youtube-package.json > /tmp/youtube-package.md

          if ! jq -e '.labels | any(.name == "youtube-yayin-paketi")' \
            /tmp/youtube-package.json > /dev/null; then
            echo "Issue bir YouTube Yayın Paketi değil; işlem yapılmadı."
            exit 0
          fi

          RAW_COMMENT=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
          normalize_command() {
            printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]'
          }
          NORMALIZED_COMMENT=$(normalize_command "$RAW_COMMENT")
          NORMALIZED_PRODUCTION_COMMAND=$(normalize_command "$PRODUCTION_COMMAND")
          NORMALIZED_TEST_COMMAND=$(normalize_command "$TEST_COMMAND")

          IS_TEST=false
          if jq -e '.labels | any(.name == "sistem-testi")' \
            /tmp/youtube-package.json > /dev/null; then
            IS_TEST=true
          fi

          if [[ "$IS_TEST" == "true" ]]; then
            if [[ "$NORMALIZED_COMMENT" != "$NORMALIZED_TEST_COMMAND" ]]; then
              echo "Test paketi yalnızca profil test onay komutunu kabul eder: $TEST_COMMAND"
              exit 0
            fi

            if [[ "$ISSUE_TITLE" != "TEST YouTube Yayın Paketi - Thumbnail Paketi #"* ]]; then
              echo "Test paketi başlığı güvenlik kuralıyla eşleşmiyor."
              exit 1
            fi

            if ! grep -Eq \
              'YOUTUBE_USAGE_V1 test=true .*uploads=0 publications=0' \
              /tmp/youtube-package.md; then
              echo "Test paketinde sıfır-yükleme ve sıfır-yayın kanıtı bulunamadı."
              exit 1
            fi

            if ! grep -Fq "**YouTube'a video yükleme:** Yapılmadı" \
              /tmp/youtube-package.md; then
              echo "Test paketinde yükleme yapılmadığı kaydı bulunamadı."
              exit 1
            fi

            if jq -e '.labels | any(.name == "test-yayin-onayli")' \
              /tmp/youtube-package.json > /dev/null; then
              echo "Bu test yayın paketi daha önce $OWNER_DISPLAY_NAME tarafından onaylanmış."
              exit 0
            fi

            gh label create "test-yayin-onayli" \
              --color "BFD4F2" \
              --description "Yüklemesiz yayın onay kapısı testi başarıyla geçti" \
              --force

            gh issue edit "$ISSUE_NUMBER" --add-label "test-yayin-onayli"

            TEST_COMMENT=$(printf '## 🧪 Test yayın onayı kaydedildi\n\n%s kullanıcısının `%s` komutu doğrulandı.\n\n**Test sonucu:** Onay kapısı geçti  \n**Video yükleme:** Yapılmadı  \n**YouTube yayını:** Yapılmadı  \n**Üretim etiketi:** Değiştirilmedi' "$OWNER_DISPLAY_NAME" "$TEST_COMMAND")
            gh issue comment "$ISSUE_NUMBER" --body "$TEST_COMMENT"

            {
              echo "### Test yayın onayı kaydedildi"
              echo "- Issue: $ISSUE_URL"
              echo "- Video yükleme: yapılmadı"
              echo "- YouTube yayını: yapılmadı"
              echo "- Eklenen etiket: test-yayin-onayli"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$NORMALIZED_COMMENT" != "$NORMALIZED_PRODUCTION_COMMAND" ]]; then
            echo "Yorum gerçek yayın onay komutu değil; işlem yapılmadı."
            exit 0
          fi

          if [[ "$ISSUE_TITLE" != "YouTube Yayın Paketi - Thumbnail Paketi #"* ]]; then
            echo "Gerçek yayın paketi başlığı güvenlik kuralıyla eşleşmiyor."
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "eren-yayin-onayi-bekliyor" or .name == "publication-approval-pending")' \
            /tmp/youtube-package.json > /dev/null; then
            echo "Gerçek paket $OWNER_DISPLAY_NAME kullanıcısının yayın onayını bekleyen durumda değil."
            exit 1
          fi

          # Review-readiness proof lives in an issue COMMENT (posted only by
          # youtube-review-readiness-gate.yml, running as github-actions[bot]
          # after the owner explicitly attested to all four conditions),
          # never in the package body itself — this sidesteps a
          # self-referential hash (the marker binds to a sha256 of the body
          # it is NOT part of). The marker must bind to the CURRENT body
          # revision: if the package body changed after readiness was
          # recorded (e.g. the package agent re-ran), the sha256 in any
          # existing marker comment no longer matches and approval fails
          # closed — no comment ever needs to be deleted for that to work.
          # Author is checked too so no other commenter — this is a public
          # repo, anyone can post an issue comment — can forge a marker by
          # hand-computing the body's public sha256.
          CURRENT_BODY_SHA=$(sha256sum /tmp/youtube-package.md | awk '{print $1}')
          READY_MARKER="<!-- YOUTUBE_REVIEW_READY_V1 issue=$ISSUE_NUMBER test=false video=1 srt=1 thumbnail=1 public=0 body_sha256=$CURRENT_BODY_SHA -->"

          gh issue view "$ISSUE_NUMBER" --comments --json comments \
            --jq '.comments[] | select(.author.login == "github-actions[bot]") | .body' \
            > /tmp/bot-comments.txt

          if ! grep -Fqx "$READY_MARKER" /tmp/bot-comments.txt; then
            echo "Geçerli (güncel paket revizyonuna bağlı) YouTube inceleme hazırlığı işareti bulunamadı; paket, readiness kaydından sonra değişmiş olabilir veya readiness hiç kaydedilmemiş."
            exit 1
          fi

          if jq -e '.labels | any(.name == "eren-yayin-onayli" or .name == "publication-approved")' \
            /tmp/youtube-package.json > /dev/null; then
            echo "Bu yayın paketi daha önce $OWNER_DISPLAY_NAME tarafından onaylanmış."
            exit 0
          fi

          gh label create "eren-yayin-onayli" \
            --color "0E8A16" \
            --description "YouTube yayın paketi $OWNER_DISPLAY_NAME tarafından son kez onaylandı" \
            --force

          gh label create "publication-approved" \
            --color "0E8A16" \
            --description "YouTube yayın paketi $OWNER_DISPLAY_NAME tarafından son kez onaylandı" \
            --force

          gh label create "yayina-hazir" \
            --color "1D76DB" \
            --description "Bütün medya dosyaları ve $OWNER_DISPLAY_NAME onayıyla yayına hazır" \
            --force

          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "eren-yayin-onayi-bekliyor" > /dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "publication-approval-pending" > /dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" \
            --add-label "eren-yayin-onayli" \
            --add-label "publication-approved" \
            --add-label "yayina-hazir"

          APPROVAL_COMMENT=$(printf '## ✅ %s kullanıcısının son yayın onayı kaydedildi\n\nVideo, zamanlanmış SRT ve thumbnail hazırlık kanıtları doğrulandı. `%s` komutu kaydedildi.\n\n**Durum:** Yayına hazır  \n**Otomatik yayın:** Bu onay kapısı yayın yapmaz  \n**Sıradaki aşama:** Ayrı yayın ajanının güvenlik kontrolleri' "$OWNER_DISPLAY_NAME" "$PRODUCTION_COMMAND")
          gh issue comment "$ISSUE_NUMBER" --body "$APPROVAL_COMMENT"

          {
            echo "### $OWNER_DISPLAY_NAME kullanıcısının son yayın onayı kaydedildi"
            echo "- Issue: $ISSUE_URL"
            echo "- Durum: yayına hazır"
            echo "- Otomatik yayın: yapılmadı"
          } >> "$GITHUB_STEP_SUMMARY"
