name: Video Orchestrator — Çekim Paketi Sonrası

"on":
  workflow_run:
    workflows:
      - "Çekim Paketi Ajanı — AI Router"
    types:
      - completed

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: video-orchestrator-after-filming
  cancel-in-progress: false

jobs:
  route-package:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Orchestrator çekirdeğini doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/video_orchestrator.py
          python3 -m json.tool .github/config/video-orchestrator.json >/dev/null
          python3 .github/scripts/test_video_orchestrator.py

      - name: Bu workflow runında üretilen Çekim Paketini güvenli bul
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          RUN_STARTED=$(jq -r '.run_started_at // .created_at // ""' /tmp/source-run.json)
          RUN_UPDATED=$(jq -r '.updated_at // ""' /tmp/source-run.json)

          if [[ -z "$RUN_STARTED" || -z "$RUN_UPDATED" ]]; then
            echo "Kaynak run zamanları çözülemedi."
            exit 1
          fi

          gh issue list \
            --state all \
            --label "cekim-paketi" \
            --search '"Çekim Paketi - Nihai Senaryolar" in:title sort:updated-desc' \
            --limit 30 \
            --json number,title,updatedAt,url > /tmp/packages.json

          export RUN_STARTED RUN_UPDATED
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def parse(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          started = parse(os.environ['RUN_STARTED'])
          updated = parse(os.environ['RUN_UPDATED'])
          packages = json.loads(Path('/tmp/packages.json').read_text(encoding='utf-8'))

          matches = []
          for item in packages:
              title = item.get('title', '')
              if not title.startswith('Çekim Paketi - Nihai Senaryolar #'):
                  continue
              ts = parse(item['updatedAt'])
              if started <= ts <= updated:
                  matches.append((ts, item))

          # Test-mode Çekim Paketi workflow'u Issue üretmez. Böyle bir durumda eski bir
          # paketi yanlışlıkla seçmek yerine güvenli biçimde hiçbir şey yapmadan çık.
          if not matches:
              Path('/tmp/no-package').write_text('1\n', encoding='utf-8')
              print('Bu kaynak run sırasında yeni/güncellenmiş Çekim Paketi yok; güvenli skip.')
              raise SystemExit(0)

          matches.sort(key=lambda pair: pair[0], reverse=True)
          if len(matches) > 1:
              # Filming package workflow concurrency ile tek çalışır. Bir run penceresinde
              # birden fazla paket görünürse belirsizlik vardır; yanlış paketi seçmeyiz.
              raise SystemExit(f'Belirsiz eşleşme: aynı run penceresinde {len(matches)} paket bulundu')

          item = matches[0][1]
          Path('/tmp/package-number').write_text(str(item['number']) + '\n', encoding='utf-8')
          print(f"Eşleşen çekim paketi: #{item['number']} — {item['title']}")
          PY

          if [[ -f /tmp/no-package ]]; then
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PACKAGE_NUMBER=$(cat /tmp/package-number)
          echo "has_package=true" >> "$GITHUB_OUTPUT"
          echo "package_number=$PACKAGE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Çekim Paketinden rota kararını üret
        if: steps.locate.outputs.has_package == 'true'
        shell: bash
        env:
          PACKAGE_NUMBER: ${{ steps.locate.outputs.package_number }}
        run: |
          set -euo pipefail

          gh issue view "$PACKAGE_NUMBER" --json title,body,url,labels > /tmp/package.json
          jq -r '.body // ""' /tmp/package.json > /tmp/package.md

          TITLE=$(jq -r '.title // ""' /tmp/package.json)
          if [[ "$TITLE" != "Çekim Paketi - Nihai Senaryolar #"* ]]; then
            echo "Geçersiz Çekim Paketi başlığı: $TITLE"
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "cekim-paketi")' /tmp/package.json >/dev/null; then
            echo "cekim-paketi etiketi eksik."
            exit 1
          fi

          python3 .github/scripts/video_orchestrator.py \
            --config .github/config/video-orchestrator.json \
            --input-file /tmp/package.md \
            --output-file /tmp/route.json \
            --mode auto

          jq -e '.paid_generation_allowed == false' /tmp/route.json >/dev/null
          jq -e '.dispatch_enabled == false' /tmp/route.json >/dev/null

          MODE=$(jq -r '.selected_mode' /tmp/route.json)
          ENGINE=$(jq -r '.engine' /tmp/route.json)
          NEXT_STAGE=$(jq -r '.next_stage' /tmp/route.json)
          REQUIRES_RAW=$(jq -r '.requires_raw_video' /tmp/route.json)
          REASON=$(jq -r '.reason' /tmp/route.json)

          case "$MODE" in
            human|hybrid|faceless) ;;
            *)
              echo "Auto routing güvenli olmayan mod seçti: $MODE"
              exit 1
              ;;
          esac

          {
            echo "PACKAGE_NUMBER=$PACKAGE_NUMBER"
            echo "MODE=$MODE"
            echo "ENGINE=$ENGINE"
            echo "NEXT_STAGE=$NEXT_STAGE"
            echo "REQUIRES_RAW=$REQUIRES_RAW"
            echo "REASON=$REASON"
          } >> "$GITHUB_ENV"

      - name: Rota kararını idempotent biçimde Çekim Paketine kaydet
        if: steps.locate.outputs.has_package == 'true'
        shell: bash
        run: |
          set -euo pipefail

          MARKER="<!-- VIDEO_ORCHESTRATOR_V1 source-run=$SOURCE_RUN_ID -->"
          gh issue view "$PACKAGE_NUMBER" --comments --json comments \
            --jq '.comments[].body // ""' > /tmp/comments.txt

          if grep -Fqx "$MARKER" /tmp/comments.txt; then
            echo "Bu kaynak run için rota kararı zaten kaydedilmiş; tekrar yazılmıyor."
            exit 0
          fi

          for label in video-route-human video-route-hybrid video-route-faceless; do
            gh label create "$label" --color "5319E7" \
              --description "Video Orchestrator üretim rotası" --force
            gh issue edit "$PACKAGE_NUMBER" --remove-label "$label" >/dev/null 2>&1 || true
          done

          ROUTE_LABEL="video-route-$MODE"
          gh issue edit "$PACKAGE_NUMBER" --add-label "$ROUTE_LABEL"
          gh label create "video-route-decided" --color "0E8A16" \
            --description "Video Orchestrator rota kararı hazır" --force
          gh issue edit "$PACKAGE_NUMBER" --add-label "video-route-decided"

          if [[ "$REQUIRES_RAW" == "true" ]]; then
            HUMAN_TEXT="Ham video gerekli. Mevcut Ham Video Teslim Kapısı kullanılacak."
          else
            HUMAN_TEXT="Ham video zorunlu değil. Faceless üretim adapter'ı daha sonra ayrı onayla çalıştırılabilir."
          fi

          cat > /tmp/route-comment.md <<EOF
          $MARKER
          ## 🧭 Video Orchestrator Kararı

          - **Üretim modu:** \`$MODE\`
          - **Önerilen motor:** \`$ENGINE\`
          - **Sıradaki aşama:** \`$NEXT_STAGE\`
          - **Ham video gerekli:** \`$REQUIRES_RAW\`
          - **Karar nedeni:** \`$REASON\`
          - **Ücretli üretim izni:** ❌ Kapalı
          - **Motor otomatik tetikleme:** ❌ Kapalı

          $HUMAN_TEXT

          > Bu karar yalnız yönlendirmedir. Hiçbir AI/video sağlayıcısı çağrılmadı ve ücretli üretim başlatılmadı.
          EOF

          gh issue comment "$PACKAGE_NUMBER" --body-file /tmp/route-comment.md

          {
            echo "### Video Orchestrator rota kararı kaydedildi"
            echo "- Çekim Paketi: #$PACKAGE_NUMBER"
            echo "- Mod: $MODE"
            echo "- Motor: $ENGINE"
            echo "- Ham video gerekli: $REQUIRES_RAW"
            echo "- Ücretli üretim: kapalı"
            echo "- AI/API kullanımı: 0 token / 0 video çağrısı"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test-mode / paket yok özetini yaz
        if: steps.locate.outputs.has_package != 'true'
        shell: bash
        run: |
          {
            echo "### Video Orchestrator güvenli skip"
            echo "- Kaynak Çekim Paketi workflow'u başarılı tamamlandı"
            echo "- Bu run penceresinde üretilmiş/güncellenmiş gerçek Çekim Paketi bulunmadı"
            echo "- Eski paket otomatik seçilmedi"
            echo "- Issue değişikliği: yok"
            echo "- AI/API/video kullanımı: 0"
          } >> "$GITHUB_STEP_SUMMARY"
