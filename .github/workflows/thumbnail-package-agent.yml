name: Thumbnail Hazırlık Ajanı

"on":
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Görselsiz güvenli test modu"
        required: true
        default: true
        type: boolean
      subtitle_package_issue:
        description: "Altyazı Paketi Issue numarası (test örneği: 25)"
        required: true
        default: "25"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: thumbnail-package-agent
  cancel-in-progress: false

jobs:
  create-thumbnail-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_ACTOR: ${{ github.actor }}
      TEST_MODE: ${{ inputs.test_mode }}
      SUBTITLE_NUMBER: ${{ inputs.subtitle_package_issue }}
      THUMBNAIL_PACKAGE_VERSION: "2"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Çalıştıranı ve girdileri doğrula
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_OWNER=$(jq -er '.business.github_owner | select(type == "string" and length > 0)' \
            .github/config/business-profile.json)
          NORMALIZED_RUN_ACTOR=$(printf '%s' "$RUN_ACTOR" | LC_ALL=C tr '[:upper:]' '[:lower:]')
          NORMALIZED_CONFIG_OWNER=$(printf '%s' "$CONFIG_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')

          if [[ "$NORMALIZED_RUN_ACTOR" != "$NORMALIZED_CONFIG_OWNER" ]]; then
            echo "Bu ajanı yalnızca işletme profilinde yetkilendirilen GitHub hesabı çalıştırabilir."
            exit 1
          fi

          if [[ "$TEST_MODE" != "true" && "$TEST_MODE" != "false" ]]; then
            echo "test_mode yalnızca true veya false olabilir."
            exit 1
          fi

          if [[ ! "$SUBTITLE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Geçerli bir Altyazı Paketi Issue numarası gerekli."
            exit 1
          fi

      - name: Kaynak altyazı paketini ve senaryoyu doğrula
        shell: bash
        run: |
          set -euo pipefail

          gh issue view "$SUBTITLE_NUMBER" \
            --json title,body,url,state,labels > /tmp/subtitle.json

          SUBTITLE_TITLE=$(jq -r '.title' /tmp/subtitle.json)
          SUBTITLE_URL=$(jq -r '.url' /tmp/subtitle.json)
          jq -r '.body' /tmp/subtitle.json > /tmp/subtitle.md

          if ! jq -e '.labels | any(.name == "altyazi-paketi" or .name == "subtitle-package")' \
            /tmp/subtitle.json > /dev/null; then
            echo "Kaynak Issue bir Altyazı Paketi değil."
            exit 1
          fi

          if [[ "$TEST_MODE" == "true" ]]; then
            if ! jq -e '.labels | any(.name == "sistem-testi")' \
              /tmp/subtitle.json > /dev/null; then
              echo "Test modu yalnızca sistem-testi etiketli paketle çalışır."
              exit 1
            fi
            if [[ "$SUBTITLE_TITLE" != "TEST Altyazı Paketi - Kurgu Paketi #"* ]]; then
              echo "Test modu için geçerli TEST Altyazı Paketi başlığı gerekli."
              exit 1
            fi
          else
            if jq -e '.labels | any(.name == "sistem-testi")' \
              /tmp/subtitle.json > /dev/null; then
              echo "Gerçek mod sistem testi paketiyle çalışamaz."
              exit 1
            fi
          fi

          FINAL_NUMBER=$(sed -nE \
            's#^- \*\*Kaynak onaylı senaryo:\*\* .*?/issues/([0-9]+).*$#\1#p' \
            /tmp/subtitle.md \
            | head -n 1)

          if [[ -z "$FINAL_NUMBER" ]]; then
            echo "Altyazı paketinin kaynak Nihai Senaryo numarası çözülemedi."
            exit 1
          fi

          gh issue view "$FINAL_NUMBER" \
            --json title,body,url,labels > /tmp/final.json

          FINAL_URL=$(jq -r '.url' /tmp/final.json)
          jq -r '.body' /tmp/final.json > /tmp/final.md

          if ! jq -e '.labels | any(.name == "eren-onayli" or .name == "owner-approved")' \
            /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryo yetkili işletme sahibi tarafından onaylanmamış."
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "cekime-hazir")' /tmp/final.json > /dev/null \
            && ! jq -e '.labels | any(.name == "production-ready")' /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryo çekime hazır değil."
            exit 1
          fi

          SOURCE_SHA=$(cat /tmp/final.md /tmp/subtitle.md \
            | sed '/<!--/,/-->/d' \
            | sha256sum \
            | awk '{print $1}')

          if [[ "$TEST_MODE" == "true" ]]; then
            THUMBNAIL_TITLE="TEST Thumbnail Paketi - Altyazı Paketi #$SUBTITLE_NUMBER"
          else
            THUMBNAIL_TITLE="Thumbnail Paketi - Altyazı Paketi #$SUBTITLE_NUMBER"
          fi

          EXISTING_NUMBER=$(gh issue list \
            --state all \
            --search "\"$THUMBNAIL_TITLE\" in:title" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$THUMBNAIL_TITLE\") | .number" \
            | head -n 1)

          SKIP_THUMBNAIL=false
          if [[ -n "$EXISTING_NUMBER" ]]; then
            gh issue view "$EXISTING_NUMBER" --json body > /tmp/existing-thumbnail.json
            EXISTING_BODY=$(jq -r '.body' /tmp/existing-thumbnail.json)
            if grep -Fq "thumbnail-source-sha256: $SOURCE_SHA" <<< "$EXISTING_BODY" \
              && grep -Fq "thumbnail-package-version: $THUMBNAIL_PACKAGE_VERSION" \
                <<< "$EXISTING_BODY"; then
              SKIP_THUMBNAIL=true
              echo "Bu kaynaklar için güncel thumbnail paketi zaten mevcut: #$EXISTING_NUMBER"
            fi
          fi

          {
            echo "SUBTITLE_URL=$SUBTITLE_URL"
            echo "FINAL_NUMBER=$FINAL_NUMBER"
            echo "FINAL_URL=$FINAL_URL"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "THUMBNAIL_TITLE=$THUMBNAIL_TITLE"
            echo "EXISTING_NUMBER=$EXISTING_NUMBER"
            echo "SKIP_THUMBNAIL=$SKIP_THUMBNAIL"
          } >> "$GITHUB_ENV"

      - name: Thumbnail hazırlık paketini üret ve doğrula
        if: env.SKIP_THUMBNAIL != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/build_thumbnail_package.py \
            --final /tmp/final.md \
            --subtitle /tmp/subtitle.md \
            --output /tmp/thumbnail-package.md \
            --final-url "$FINAL_URL" \
            --subtitle-url "$SUBTITLE_URL" \
            --profile .github/config/business-profile.json \
            --test-mode "$TEST_MODE"

          if [[ ! -s /tmp/thumbnail-package.md ]]; then
            echo "Thumbnail hazırlık paketi boş üretildi."
            exit 1
          fi

          SECTION_COUNT=$(grep -Ec '^##[[:space:]]+[1-7]\.' /tmp/thumbnail-package.md)
          OPTION_COUNT=$(grep -Ec '^###[[:space:]]+Seçenek[[:space:]]+[ABC]$' /tmp/thumbnail-package.md)
          if [[ "$SECTION_COUNT" -ne 7 || "$OPTION_COUNT" -ne 3 ]]; then
            echo "Thumbnail paketi yedi bölüm ve üç seçenek içermeli."
            exit 1
          fi

          if ! grep -Fq 'AI kullanımı:** 0 giriş tokenı, 0 çıkış tokenı, 0 web araması, 0 görsel üretimi' \
            /tmp/thumbnail-package.md; then
            echo "Sıfır-kullanım kaydı eksik."
            exit 1
          fi

          if ! grep -Fq 'Görsel üretilmedi, dosya yüklenmedi ve yayın işlemi yapılmadı.' \
            /tmp/thumbnail-package.md; then
            echo "Güvenlik bildirimi eksik."
            exit 1
          fi

          OUTPUT_CHARS=$(wc -c < /tmp/thumbnail-package.md)
          echo "THUMBNAIL_OUTPUT_CHARS=$OUTPUT_CHARS" >> "$GITHUB_ENV"

          {
            echo "### Thumbnail ajanı kullanım özeti"
            echo "- test_mode: $TEST_MODE"
            echo "- ai_input_tokens: 0"
            echo "- ai_output_tokens: 0"
            echo "- web_searches: 0"
            echo "- images_generated: 0"
            echo "- output_chars: $OUTPUT_CHARS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Thumbnail paketini Issue olarak kaydet
        if: env.SKIP_THUMBNAIL != 'true'
        shell: bash
        run: |
          set -euo pipefail

          OWNER_DISPLAY_NAME=$(jq -r '.business.owner_display_name' \
            .github/config/business-profile.json)

          {
            echo "<!-- thumbnail-package-version: $THUMBNAIL_PACKAGE_VERSION -->"
            echo "<!-- thumbnail-source-sha256: $SOURCE_SHA -->"
            echo "<!-- THUMBNAIL_USAGE_V1 test=$TEST_MODE input=0 output=0 web_search=0 image_generation=0 output_chars=$THUMBNAIL_OUTPUT_CHARS -->"
            cat /tmp/thumbnail-package.md
          } > /tmp/thumbnail-issue-body.md

          echo "OWNER_DISPLAY_NAME=$OWNER_DISPLAY_NAME" >> "$GITHUB_ENV"

      - name: Thumbnail paketi etiketlerini kalıcı hale getir
        if: env.SKIP_THUMBNAIL != 'true'
        shell: bash
        env:
          THUMBNAIL_BODY_FILE: /tmp/thumbnail-issue-body.md
        run: bash .github/scripts/persist_thumbnail_package_labels.sh

      - name: Thumbnail hazırlık paketi yorumunu ve özetini yaz
        if: env.SKIP_THUMBNAIL != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TEST_MODE" == "false" ]]; then
            gh issue comment "$SUBTITLE_NUMBER" \
              --body "🖼️ Thumbnail hazırlık paketi oluşturuldu: $THUMBNAIL_URL"
          fi

          {
            echo "### Thumbnail hazırlık paketi oluşturuldu"
            echo "- Test modu: $TEST_MODE"
            echo "- Kaynak altyazı paketi: #$SUBTITLE_NUMBER"
            echo "- Kaynak nihai senaryo: #$FINAL_NUMBER"
            echo "- Thumbnail paketi: #$THUMBNAIL_NUMBER"
            echo "- AI tokenı: 0"
            echo "- Görsel üretimi: 0"
            echo "- Yayın işlemi: yapılmadı"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Güncel thumbnail paketi zaten varsa özeti yaz
        if: env.SKIP_THUMBNAIL == 'true'
        shell: bash
        run: |
          set -euo pipefail

          THUMBNAIL_URL=$(gh issue view "$EXISTING_NUMBER" --json url --jq '.url')
          echo "### Güncel thumbnail paketi zaten mevcut" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test modu: $TEST_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kaynak altyazı paketi: #$SUBTITLE_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Paket: $THUMBNAIL_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI tokenı: 0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Görsel üretimi: 0" >> "$GITHUB_STEP_SUMMARY"
