name: Ham Video Teslim Kapısı

"on":
  workflow_dispatch:
    inputs:
      filming_package_issue:
        description: "Çekim Paketi Issue numarası (örnek: 23)"
        required: true
        type: string
      video_format:
        description: "Teslim edilen çekim türü"
        required: true
        type: choice
        options:
          - Ana video (yatay)
          - Shorts/Reels (dikey)
          - Ana video ve Shorts/Reels
      file_names:
        description: "Yalnızca ham video dosya adları; bağlantı veya gizli bilgi yazma"
        required: true
        type: string
      storage_location:
        description: "Ham videoların özel olarak tutulduğu yer"
        required: true
        type: choice
        options:
          - Yerel cihaz
          - ChatGPT'ye yüklenecek
          - Google Drive (özel)
          - Diğer özel depolama
      storage_reference:
        description: "İsteğe bağlı klasör/iş adı; özel bağlantı yazma"
        required: false
        type: string
      notes:
        description: "İsteğe bağlı kısa çekim notu; bağlantı veya gizli bilgi yazma"
        required: false
        type: string
      sound_and_image_checked:
        description: "Her dosyanın sesini ve görüntüsünü açıp kontrol ettim"
        required: true
        default: false
        type: boolean
      ready_for_editing:
        description: "Bu teslimin kurgu kuyruğuna alınmasını onaylıyorum"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: raw-video-intake-${{ inputs.filming_package_issue }}
  cancel-in-progress: false

jobs:
  register-raw-video-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_ACTOR: ${{ github.actor }}
      PACKAGE_NUMBER: ${{ inputs.filming_package_issue }}
      VIDEO_FORMAT: ${{ inputs.video_format }}
      FILE_NAMES: ${{ inputs.file_names }}
      STORAGE_LOCATION: ${{ inputs.storage_location }}
      STORAGE_REFERENCE: ${{ inputs.storage_reference }}
      NOTES: ${{ inputs.notes }}
      SOUND_AND_IMAGE_CHECKED: ${{ inputs.sound_and_image_checked }}
      READY_FOR_EDITING: ${{ inputs.ready_for_editing }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Merkezi işletme profilini doğrula ve yükle
        shell: bash
        run: |
          set -euo pipefail
          PROFILE=.github/config/business-profile.json
          python3 .github/scripts/validate_business_config.py --config "$PROFILE" --output /tmp/profile.md --test-mode true

          echo "BRAND_NAME=$(jq -r '.business.brand_name' "$PROFILE")" >> "$GITHUB_ENV"
          echo "OWNER_NAME=$(jq -r '.business.owner_display_name' "$PROFILE")" >> "$GITHUB_ENV"
          echo "AUTHORIZED_GITHUB_OWNER=$(jq -r '.business.github_owner' "$PROFILE")" >> "$GITHUB_ENV"
          echo "BUSINESS_TIMEZONE=$(jq -r '.business.timezone' "$PROFILE")" >> "$GITHUB_ENV"

      - name: Yetkili kullanıcıyı ve teslim bilgilerini doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUN_ACTOR" != "$AUTHORIZED_GITHUB_OWNER" ]]; then
            echo "Bu kapıyı yalnızca profilde tanımlı yetkili GitHub kullanıcısı çalıştırabilir."
            exit 1
          fi

          if [[ ! "$PACKAGE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Çekim Paketi Issue numarası pozitif bir tam sayı olmalı."
            exit 1
          fi

          if [[ "$SOUND_AND_IMAGE_CHECKED" != "true" ]]; then
            echo "Teslimden önce her dosyanın sesi ve görüntüsü kontrol edilmeli."
            exit 1
          fi

          if [[ "$READY_FOR_EDITING" != "true" ]]; then
            echo "Kurgu kuyruğu onayı verilmedi; teslim kaydedilmedi."
            exit 1
          fi

          if [[ -z "${FILE_NAMES//[[:space:]]/}" ]]; then
            echo "En az bir ham video dosya adı gerekli."
            exit 1
          fi

          if (( ${#FILE_NAMES} > 500 )); then
            echo "Dosya adı alanı 500 karakteri aşamaz."
            exit 1
          fi

          if (( ${#STORAGE_REFERENCE} > 160 )); then
            echo "Depolama referansı 160 karakteri aşamaz."
            exit 1
          fi

          if (( ${#NOTES} > 500 )); then
            echo "Çekim notu 500 karakteri aşamaz."
            exit 1
          fi

          PRIVATE_FIELDS="$FILE_NAMES
          $STORAGE_REFERENCE
          $NOTES"

          if grep -Eiq '(https?://|www\.|drive\.google|dropbox\.|[?&](token|key|signature|auth)=)' \
            <<< "$PRIVATE_FIELDS"; then
            echo "Güvenlik nedeniyle bağlantı, erişim anahtarı veya imzalı URL kabul edilmez."
            echo "Yalnızca dosya adı ve bağlantı içermeyen özel klasör referansı yaz."
            exit 1
          fi

      - name: Çekim paketini ve işletme sahibi onayını doğrula
        shell: bash
        run: |
          set -euo pipefail

          gh issue view "$PACKAGE_NUMBER" \
            --json title,body,url,state,labels > /tmp/package.json

          PACKAGE_TITLE=$(jq -r '.title' /tmp/package.json)
          PACKAGE_URL=$(jq -r '.url' /tmp/package.json)
          jq -r '.body // ""' /tmp/package.json > /tmp/package-body.md

          if [[ "$PACKAGE_TITLE" != "Çekim Paketi - Nihai Senaryolar #"* ]]; then
            echo "#$PACKAGE_NUMBER geçerli bir Çekim Paketi Issue'su değil."
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "cekim-paketi")' /tmp/package.json > /dev/null \
            && ! jq -e '.labels | any(.name == "filming-package")' /tmp/package.json > /dev/null; then
            echo "Çekim Paketi Issue'sunda cekim-paketi etiketi bulunamadı."
            exit 1
          fi

          # Deterministic provenance, not just a title-parsed number: every
          # real filming package already embeds the exact SHA-256 of the
          # Nihai Senaryolar body it was generated from (see
          # filming-package-agent-v4-router.yml's <!-- source-body-sha256 -->
          # marker). If that source Issue was edited afterwards, its CURRENT
          # body hash will no longer match — proving the filming package is
          # stale relative to content nobody re-approved/re-selected/re-
          # handed-off for.
          PACKAGE_SOURCE_SHA=$(grep -oE '<!-- source-body-sha256: [0-9a-f]{64} -->' /tmp/package-body.md \
            | grep -oE '[0-9a-f]{64}' \
            | head -n 1 \
            || true)

          if [[ -z "$PACKAGE_SOURCE_SHA" ]]; then
            echo "Çekim paketinde kaynak içerik doğrulama imzası (source-body-sha256) bulunamadı."
            exit 1
          fi

          FINAL_NUMBER=$(grep -oE 'Nihai Senaryolar #[0-9]+' <<< "$PACKAGE_TITLE" \
            | grep -oE '[0-9]+' \
            | head -n 1 \
            || true)

          if [[ -z "$FINAL_NUMBER" ]]; then
            echo "Çekim paketinin kaynak Nihai Senaryolar numarası çözülemedi."
            exit 1
          fi

          gh issue view "$FINAL_NUMBER" \
            --json title,body,url,labels > /tmp/final.json

          if ! jq -e '.labels | any(.name == "eren-onayli" or .name == "owner-approved")' \
            /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryolar yetkili işletme sahibi tarafından onaylanmamış."
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "cekime-hazir")' /tmp/final.json > /dev/null \
            && ! jq -e '.labels | any(.name == "production-ready")' /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryolar çekime hazır değil."
            exit 1
          fi

          jq -r '.body // ""' /tmp/final.json > /tmp/final-body.md
          CURRENT_FINAL_SHA=$(sha256sum /tmp/final-body.md | awk '{print $1}')

          if [[ "$PACKAGE_SOURCE_SHA" != "$CURRENT_FINAL_SHA" ]]; then
            echo "Çekim paketi güncel olmayan bir Nihai Senaryolar içeriğine dayanıyor (kaynak içerik sonradan değişti); ham video teslimi kabul edilemez."
            exit 1
          fi

          FINAL_URL=$(jq -r '.url' /tmp/final.json)

          {
            echo "PACKAGE_TITLE=$PACKAGE_TITLE"
            echo "PACKAGE_URL=$PACKAGE_URL"
            echo "FINAL_NUMBER=$FINAL_NUMBER"
            echo "FINAL_URL=$FINAL_URL"
          } >> "$GITHUB_ENV"

      - name: Teslim kaydını güvenli biçimde hazırla
        shell: bash
        run: |
          set -euo pipefail

          RUN_DATETIME=$(TZ="$BUSINESS_TIMEZONE" date '+%d.%m.%Y %H:%M')
          INTAKE_TITLE="Ham Video Teslimi - Çekim Paketi #$PACKAGE_NUMBER"

          escape_html() {
            sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g'
          }

          SAFE_FILE_NAMES=$(printf '%s' "$FILE_NAMES" | escape_html)
          SAFE_STORAGE_REFERENCE=$(printf '%s' "${STORAGE_REFERENCE:-Belirtilmedi}" | escape_html)
          SAFE_NOTES=$(printf '%s' "${NOTES:-Not eklenmedi}" | escape_html)

          METADATA_SHA=$(printf '%s\n' \
            "$PACKAGE_NUMBER" \
            "$VIDEO_FORMAT" \
            "$FILE_NAMES" \
            "$STORAGE_LOCATION" \
            "$STORAGE_REFERENCE" \
            "$NOTES" \
            | sha256sum \
            | awk '{print $1}')

          {
            echo "<!-- raw-video-intake-version: 1 -->"
            echo "<!-- source-package-issue: #$PACKAGE_NUMBER -->"
            echo "<!-- intake-metadata-sha256: $METADATA_SHA -->"
            echo "# 📥 $BRAND_NAME — HAM VİDEO TESLİMİ"
            echo
            echo "> **Durum:** 🟡 Kurgu bekliyor"
            echo
            echo "**Kaynak çekim paketi:** $PACKAGE_URL"
            echo "**Kaynak onaylı senaryo:** $FINAL_URL"
            echo "**Teslimi kaydeden:** @$RUN_ACTOR"
            echo "**Yetkili işletme sahibi:** $OWNER_NAME"
            echo "**Teslim tarihi:** $RUN_DATETIME ($BUSINESS_TIMEZONE)"
            echo
            echo "## Teslim Bilgileri"
            echo
            echo "- **Video biçimi:** $VIDEO_FORMAT"
            echo "- **Özel depolama yeri:** $STORAGE_LOCATION"
            echo "- **Özel klasör/iş referansı:** $SAFE_STORAGE_REFERENCE"
            echo "- **Ses ve görüntü kontrolü:** ✅ Tamamlandı"
            echo "- **Kurgu kuyruğu onayı:** ✅ Verildi"
            echo
            echo "## Ham Video Dosyaları"
            echo
            echo "$SAFE_FILE_NAMES"
            echo
            echo "## Çekim Notu"
            echo
            echo "$SAFE_NOTES"
            echo
            echo "## Gizlilik Kuralı"
            echo
            echo "Bu herkese açık Issue'da ham video bağlantısı tutulmaz."
            echo "Özel Drive/Dropbox bağlantılarını, erişim anahtarlarını veya imzalı URL'leri yorumlara ekleme."
            echo
            echo "## Sıradaki Aşama"
            echo
            echo "- [ ] Ham videolar özel kanaldan kurgu sistemine aktarıldı"
            echo "- [ ] Kurgu taslağı oluşturuldu"
            echo "- [ ] Altyazılar kontrol edildi"
            echo "- [ ] Nihai yayın için işletme sahibi onayı alındı"
          } > /tmp/intake-body.md

          {
            echo "INTAKE_TITLE=$INTAKE_TITLE"
            echo "METADATA_SHA=$METADATA_SHA"
          } >> "$GITHUB_ENV"

      - name: Kurgu bekleyen teslim Issue'sunu kaydet
        shell: bash
        run: |
          set -euo pipefail

          gh label create "ham-video-teslim" \
            --color "0052CC" \
            --description "Ham video teslim bilgileri kaydedildi" \
            --force

          gh label create "kurgu-bekliyor" \
            --color "FBCA04" \
            --description "Ham videolar kurgu aşamasını bekliyor" \
            --force

          gh label create "ham-video-teslim-alindi" \
            --color "0E8A16" \
            --description "Çekim paketi için ham video teslimi alındı" \
            --force

          EXISTING_NUMBER=$(gh issue list \
            --state all \
            --search "\"$INTAKE_TITLE\" in:title" \
            --limit 20 \
            --json number,title,labels \
            --jq ".[] | select(.title == \"$INTAKE_TITLE\") | .number" \
            | head -n 1)

          if [[ -n "$EXISTING_NUMBER" ]]; then
            if gh issue view "$EXISTING_NUMBER" --json labels --jq '.labels[].name' \
              | grep -qx 'kurgu-tamamlandi'; then
              echo "Bu çekim paketinin kurgusu tamamlanmış; mevcut teslim kaydı değiştirilemez."
              exit 1
            fi

            gh issue edit "$EXISTING_NUMBER" \
              --title "$INTAKE_TITLE" \
              --body-file /tmp/intake-body.md \
              --add-label "ham-video-teslim" \
              --add-label "kurgu-bekliyor"
            INTAKE_URL=$(gh issue view "$EXISTING_NUMBER" --json url --jq '.url')
            INTAKE_NUMBER="$EXISTING_NUMBER"
            ACTION_TEXT="Mevcut teslim kaydı güncellendi"
          else
            INTAKE_URL=$(gh issue create \
              --title "$INTAKE_TITLE" \
              --body-file /tmp/intake-body.md \
              --label "ham-video-teslim" \
              --label "kurgu-bekliyor")
            INTAKE_NUMBER=$(grep -oE '[0-9]+$' <<< "$INTAKE_URL")
            ACTION_TEXT="Yeni teslim kaydı oluşturuldu"
          fi

          gh issue edit "$PACKAGE_NUMBER" --add-label "ham-video-teslim-alindi"
          gh issue comment "$PACKAGE_NUMBER" \
            --body "📥 Ham video teslim bilgileri kaydedildi ve kurgu kuyruğuna alındı: $INTAKE_URL"

          {
            echo "### Ham video teslim kapısı tamamlandı"
            echo "- Kaynak çekim paketi: #$PACKAGE_NUMBER"
            echo "- Kaynak nihai senaryo: #$FINAL_NUMBER"
            echo "- Teslim kaydı: #$INTAKE_NUMBER"
            echo "- İşlem: $ACTION_TEXT"
            echo "- Durum: Kurgu bekliyor"
            echo "- AI kullanımı: 0 token"
            echo "- Ham video bağlantısı: GitHub'da tutulmadı"
          } >> "$GITHUB_STEP_SUMMARY"
