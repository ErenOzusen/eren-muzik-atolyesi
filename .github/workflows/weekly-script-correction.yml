name: Haftalık Düzeltme Ajanı

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Claude çağrısı ve kaynak Issue okuması yapmadan profil bağlantısını test et"
        required: true
        default: true
        type: boolean
      real_ai_budget_cap:
        description: "Gerçek AI bütçe ön kontrolünü zorla: $0.50 zincir bütçesi, yalnızca Anthropic, sıfır web araması"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-script-correction
  cancel-in-progress: false

jobs:
  correct-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL }}
      QWEN_CHAT_ENDPOINT: ${{ vars.QWEN_CHAT_ENDPOINT }}
      TEST_MODE: ${{ inputs.test_mode || 'false' }}
      REAL_AI_BUDGET_CAP: ${{ inputs.real_ai_budget_cap || 'false' }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Router ve yapılandırmayı yerel doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/ai_router.py
          python3 -m json.tool .github/config/ai-router.json > /dev/null

      - name: Merkezi işletme profilini doğrula ve yükle
        shell: bash
        run: |
          set -euo pipefail
          PROFILE=.github/config/business-profile.json
          python3 .github/scripts/validate_business_config.py --config "$PROFILE" --output /tmp/profile.md --test-mode true

          echo "BRAND_NAME=$(jq -r '.business.brand_name' "$PROFILE")" >> "$GITHUB_ENV"
          echo "OWNER_NAME=$(jq -r '.business.owner_display_name' "$PROFILE")" >> "$GITHUB_ENV"
          echo "BUSINESS_CATEGORY=$(jq -r '.business.category' "$PROFILE")" >> "$GITHUB_ENV"
          echo "BUSINESS_TIMEZONE=$(jq -r '.business.timezone' "$PROFILE")" >> "$GITHUB_ENV"
          echo "SERVICES_TEXT=$(jq -r '.offer.services | join(", ")' "$PROFILE")" >> "$GITHUB_ENV"
          echo "EQUIPMENT_TEXT=$(jq -r '.offer.available_equipment | join(", ")' "$PROFILE")" >> "$GITHUB_ENV"
          echo "RESERVATION_URL=$(jq -r '.offer.reservation_url' "$PROFILE")" >> "$GITHUB_ENV"
          echo "PRIMARY_CTA=$(jq -r '.offer.primary_cta' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CONTENT_TOPICS_TEXT=$(jq -r '.content.content_topics | join(", ")' "$PROFILE")" >> "$GITHUB_ENV"
          echo "PRIMARY_PLATFORM=$(jq -r '.content.primary_platform' "$PROFILE")" >> "$GITHUB_ENV"
          echo "SECONDARY_FORMATS_TEXT=$(jq -r '.content.secondary_formats | join(", ")' "$PROFILE")" >> "$GITHUB_ENV"
          echo "APPROVAL_COMMAND=$(jq -r '.approval.production_command' "$PROFILE")" >> "$GITHUB_ENV"
          echo "DEFAULT_MODEL=$(jq -r '.cost_control.default_model' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_SCENARIO_COUNT=$(jq -r '.content.correction.scenario_count' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_MAX_BASE_CHARS=$(jq -r '.content.correction.max_base_chars' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_MAX_QC_CHARS=$(jq -r '.content.correction.max_qc_chars' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_MAX_FINAL_CHECK_CHARS=$(jq -r '.content.correction.max_final_check_chars' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_MAX_TOTAL_INPUT_CHARS=$(jq -r '.content.correction.max_total_input_chars' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_MAX_MODEL_OUTPUT=$(jq -r '.content.correction.max_model_output' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_DOMAIN_RULE_COUNT=$(jq -r '.content.correction.domain_rules | length' "$PROFILE")" >> "$GITHUB_ENV"
          echo "CORRECTION_DOMAIN_RULES_TEXT=$(jq -r '.content.correction.domain_rules | join("; ")' "$PROFILE")" >> "$GITHUB_ENV"
          echo "PROFILE_FILE_SHA=$(sha256sum "$PROFILE" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Düzeltme ajanı profil bağlantısını sıfır-token ile test et
        if: ${{ env.TEST_MODE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="TEST Merkezi Profil Bağlantısı - Düzeltme Ajanı"
          {
            echo "<!-- PROFILE_BINDING_USAGE_V1 agent=weekly-script-correction test=true input=0 output=0 web_search=0 source_issue_read=0 profile_sha=$PROFILE_FILE_SHA -->"
            echo "> **Durum:** ✅ Düzeltme Ajanı merkezi işletme profiline güvenle bağlandı."
            echo
            echo "# 🔗 DÜZELTME AJANI PROFİL BAĞLANTI TESTİ"
            echo
            echo "- **Marka:** $BRAND_NAME"
            echo "- **İşletme sahibi:** $OWNER_NAME"
            echo "- **Faaliyet alanı:** $BUSINESS_CATEGORY"
            echo "- **Hizmetler:** $SERVICES_TEXT"
            echo "- **Mevcut ekipman:** $EQUIPMENT_TEXT"
            echo "- **İçerik konuları:** $CONTENT_TOPICS_TEXT"
            echo "- **Platformlar:** $PRIMARY_PLATFORM; $SECONDARY_FORMATS_TEXT"
            echo "- **Senaryo sayısı:** $CORRECTION_SCENARIO_COUNT"
            echo "- **Toplam kaynak sınırı:** $CORRECTION_MAX_TOTAL_INPUT_CHARS karakter"
            echo "- **Model / çıktı bütçesi:** $DEFAULT_MODEL / $CORRECTION_MAX_MODEL_OUTPUT token"
            echo "- **Sektörel düzeltme kuralı:** $CORRECTION_DOMAIN_RULE_COUNT"
            echo "- **AI kullanımı:** 0 giriş, 0 çıkış tokenı; 0 web araması"
            echo "- **Kaynak Issue okuma:** 0"
            echo "- **Gerçek nihai senaryo:** Oluşturulmadı veya değiştirilmedi"
          } > /tmp/correction-profile-test.md

          gh label create profil-baglantisi --color 0E8A16 --description "Ajanın merkezi işletme profili bağlantısı" --force
          gh label create sistem-testi --color BFD4F2 --description "Gerçek üretim kayıtlarını değiştirmeyen sistem testi" --force
          NUMBER=$(gh issue list --state all --search "\"$TITLE\" in:title" --limit 20 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [[ -n "$NUMBER" ]]; then
            gh issue edit "$NUMBER" --body-file /tmp/correction-profile-test.md --add-label profil-baglantisi --add-label sistem-testi
            URL=$(gh issue view "$NUMBER" --json url --jq '.url')
          else
            URL=$(gh issue create --title "$TITLE" --body-file /tmp/correction-profile-test.md --label profil-baglantisi --label sistem-testi)
          fi

          {
            echo "### Düzeltme ajanı profil testi başarılı"
            echo "- AI tokenı: 0 giriş / 0 çıkış"
            echo "- Web araması: 0"
            echo "- Kaynak Issue okuma: 0"
            echo "- Test kaydı: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kaynak senaryoları ve kalite raporunu bul
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          QC_NUMBER=$(gh issue list \
            --state all \
            --search '"Kalite Kontrol Raporu" in:title sort:created-desc' \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$QC_NUMBER" ]]; then
            echo "Kalite Kontrol Raporu bulunamadı."
            exit 1
          fi

          gh issue view "$QC_NUMBER" --json title,body,url > /tmp/qc.json
          jq -r '.body' /tmp/qc.json > /tmp/qc-report.raw.md
          QC_URL=$(jq -r '.url' /tmp/qc.json)

          SCRIPT_NUMBER=$(grep -oE 'issues/[0-9]+' /tmp/qc-report.raw.md | grep -oE '[0-9]+' | head -n 1 || true)
          if [[ -z "$SCRIPT_NUMBER" ]]; then
            SCRIPT_NUMBER=$(grep -oiE 'Issue[[:space:]]*(\[#|#)?[0-9]+' /tmp/qc-report.raw.md \
              | grep -oE '[0-9]+' \
              | head -n 1 || true)
          fi
          if [[ -z "$SCRIPT_NUMBER" ]]; then
            SCRIPT_NUMBER=$(gh issue list \
              --state all \
              --search '"Haftalık Senaryolar" in:title sort:created-desc' \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty')
          fi

          if [[ -z "$SCRIPT_NUMBER" ]]; then
            echo "Haftalık Senaryolar Issue'su bulunamadı."
            exit 1
          fi

          gh issue view "$SCRIPT_NUMBER" --json title,body,url > /tmp/scripts.json
          SCRIPT_TITLE=$(jq -r '.title' /tmp/scripts.json)
          if [[ "$SCRIPT_TITLE" != Haftalık\ Senaryolar* ]]; then
            echo "QC raporundan çözülen #$SCRIPT_NUMBER haftalık senaryo Issue'su değil: $SCRIPT_TITLE"
            exit 1
          fi
          jq -r '.body' /tmp/scripts.json > /tmp/scripts.raw.md
          SCRIPT_URL=$(jq -r '.url' /tmp/scripts.json)

          RUN_DATE=$(TZ="$BUSINESS_TIMEZONE" date +%d-%m-%Y)
          CURRENT_FINAL_TITLE="Nihai Senaryolar - $RUN_DATE"
          FINAL_CHECK_TITLE="Son Teknik Kontrol Raporu - $RUN_DATE"
          CURRENT_FINAL_NUMBER=$(gh issue list \
            --state all \
            --search "\"$CURRENT_FINAL_TITLE\" in:title sort:updated-desc" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$CURRENT_FINAL_TITLE\") | .number" \
            | head -n 1)

          SOURCE_MODE="original"
          BASE_URL="$SCRIPT_URL"
          cp /tmp/scripts.raw.md /tmp/base-scripts.raw.md
          CURRENT_FINAL_URL="Yok"
          if [[ -n "$CURRENT_FINAL_NUMBER" ]]; then
            gh issue view "$CURRENT_FINAL_NUMBER" --json body,url > /tmp/current-final.json
            jq -r '.body' /tmp/current-final.json > /tmp/current-final-candidate.md
            COMPLETE_FINAL=true
            for NUMBER in $(seq 1 "$CORRECTION_SCENARIO_COUNT"); do
              if ! grep -Eiq "SENARYO[[:space:]]*$NUMBER([^0-9]|$)" /tmp/current-final-candidate.md; then
                COMPLETE_FINAL=false
              fi
            done
            if [[ "$COMPLETE_FINAL" == "true" ]]; then
              cp /tmp/current-final-candidate.md /tmp/base-scripts.raw.md
              CURRENT_FINAL_URL=$(jq -r '.url' /tmp/current-final.json)
              BASE_URL="$CURRENT_FINAL_URL"
              SOURCE_MODE="current_final"
            else
              echo "Mevcut nihai taslak üç senaryonun tamamını içermediği için temel kaynak yapılmadı."
            fi
          fi

          : > /tmp/final-technical-report.raw.md
          FINAL_CHECK_URL="Yok"
          FINAL_CHECK_NUMBER=$(gh issue list \
            --state all \
            --search "\"$FINAL_CHECK_TITLE\" in:title sort:updated-desc" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$FINAL_CHECK_TITLE\") | .number" \
            | head -n 1)

          if [[ -n "$FINAL_CHECK_NUMBER" && "$SOURCE_MODE" == "current_final" ]]; then
            gh issue view "$FINAL_CHECK_NUMBER" --json body,url > /tmp/final-check.json
            jq -r '.body' /tmp/final-check.json > /tmp/final-check-candidate.md
            CANDIDATE_URL=$(jq -r '.url' /tmp/final-check.json)
            if grep -q 'DÜZELTME GEREKİYOR' /tmp/final-check-candidate.md \
              && { grep -Fq "$CURRENT_FINAL_URL" /tmp/final-check-candidate.md \
                || grep -Eq "issues/$CURRENT_FINAL_NUMBER([^0-9]|$)" /tmp/final-check-candidate.md; }; then
              cp /tmp/final-check-candidate.md /tmp/final-technical-report.raw.md
              FINAL_CHECK_URL="$CANDIDATE_URL"
            else
              echo "Son teknik kontrol kaynak nihai Issue ile eşleşmediği veya bloklayıcı olmadığı için kullanılmadı."
            fi
          fi

          {
            echo "QC_NUMBER=$QC_NUMBER"
            echo "QC_URL=$QC_URL"
            echo "SCRIPT_NUMBER=$SCRIPT_NUMBER"
            echo "SCRIPT_URL=$SCRIPT_URL"
            echo "BASE_URL=$BASE_URL"
            echo "SOURCE_MODE=$SOURCE_MODE"
            echo "CURRENT_FINAL_URL=$CURRENT_FINAL_URL"
            echo "FINAL_CHECK_URL=$FINAL_CHECK_URL"
          } >> "$GITHUB_ENV"

      - name: Kaynakları deterministik olarak küçült ve doğrula
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path


          def clean(path: str, kind: str) -> str:
              text = Path(path).read_text(encoding="utf-8")
              text = re.sub(r"<!--.*?-->", "", text, flags=re.DOTALL)
              text = re.sub(r"(?m)^> \*\*Durum:\*\*.*\n?", "", text)
              text = re.sub(
                  r"(?m)^\*\*(?:Kaynak senaryolar|Kalite kontrol raporu|Son teknik kontrol raporu|Temel alınan metin):\*\*.*\n?",
                  "",
                  text,
              )
              if kind == "qc":
                  text = re.sub(
                      r"(?ms)^## Kullanılan Kaynaklar\s*\n.*?(?=^GENEL KARAR:|\Z)",
                      "",
                      text,
                  )
              text = re.sub(
                  r"(?ms)\n---\s*\nOnaylamak için bu Issue'ya.*\Z",
                  "",
                  text,
              )
              text = re.sub(r"[ \t]+$", "", text, flags=re.MULTILINE)
              text = re.sub(r"\n{3,}", "\n\n", text)
              return text.strip() + "\n" if text.strip() else ""


          base = clean("/tmp/base-scripts.raw.md", "base")
          qc = clean("/tmp/qc-report.raw.md", "qc")
          final_check = clean("/tmp/final-technical-report.raw.md", "final_check")

          limits = {
              "temel metin": (len(base), int(os.environ["CORRECTION_MAX_BASE_CHARS"])),
              "kalite raporu": (len(qc), int(os.environ["CORRECTION_MAX_QC_CHARS"])),
              "son teknik kontrol": (
                  len(final_check),
                  int(os.environ["CORRECTION_MAX_FINAL_CHECK_CHARS"]),
              ),
          }
          for label, (actual, maximum) in limits.items():
              if actual > maximum:
                  raise SystemExit(
                      f"{label} güvenli sınırı aşıyor: {actual} > {maximum}. "
                      "Kaliteyi korumak için sessiz kırpma yapılmadı."
                  )

          total = len(base) + len(qc) + len(final_check)
          total_limit = int(os.environ["CORRECTION_MAX_TOTAL_INPUT_CHARS"])
          if total > total_limit:
              raise SystemExit(
                  f"Toplam düzeltme girdisi güvenli sınırı aşıyor: {total} > {total_limit}. "
                  "Kaliteyi korumak için sessiz kırpma yapılmadı."
              )

          scenario_count = int(os.environ["CORRECTION_SCENARIO_COUNT"])
          for number in range(1, scenario_count + 1):
              if not re.search(rf"(?i)SENARYO\s*{number}\b", base):
                  raise SystemExit(f"Temel metinde SENARYO {number} bulunamadı.")

          Path("/tmp/base-scripts.md").write_text(base, encoding="utf-8")
          Path("/tmp/qc-report.md").write_text(qc, encoding="utf-8")
          Path("/tmp/final-technical-report.md").write_text(final_check, encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"CORRECTION_SOURCE_CHARS={total}\n")

          print(
              f"correction_sources_ok base={len(base)} qc={len(qc)} "
              f"final_check={len(final_check)} total={total}"
          )
          PY

      - name: Düzeltme isteğini hazırla
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/system-prompt.txt <<PROMPT
          Sen $BRAND_NAME için çalışan nihai senaryo düzeltme editörüsün.

          MERKEZİ İŞLETME PROFİLİ:
          - Faaliyet alanı: $BUSINESS_CATEGORY
          - Hizmetler: $SERVICES_TEXT
          - Mevcut ekipman: $EQUIPMENT_TEXT
          - İçerik konuları: $CONTENT_TOPICS_TEXT
          - Platformlar: $PRIMARY_PLATFORM; $SECONDARY_FORMATS_TEXT
          - Ana CTA: $PRIMARY_CTA — $RESERVATION_URL

          ÖNCELİK VE GÜVENİLİRLİK:
          1. Varsa kaynakla eşleştirilmiş Son Teknik Kontrol, ardından Kalite Kontrol, ardından temel metin gelir.
          2. Yeni web araştırması yapma; kaynak, fiyat, kampanya veya doğrulanmamış bilgi uydurma.
          3. YANLIŞ/YANILTICI bulguları düzelt veya kaldır. BELİRSİZ iddiaları temkinli yaz.
          4. DOĞRU bulunan içeriği, güçlü kancayı, akışı ve samimi anlatım tarzını gereksiz değiştirme.
          5. Yalnızca profildeki hizmet, ekipman ve CTA gerçeklerini kullan.
          6. Tüm düzeltmeleri tek geçişte uygula; çıktıda analiz, özür veya kaynak uydurması gösterme.

          SEKTÖREL KURALLAR:
          $CORRECTION_DOMAIN_RULES_TEXT

          ÇIKTI SÖZLEŞMESİ:
          - Tam olarak $CORRECTION_SCENARIO_COUNT senaryo üret.
          - İlk satır tam olarak: # 🎬 $BRAND_NAME — NİHAİ SENARYOLAR
          - Senaryo başlıklarını sırasıyla "## SENARYO 1:", "## SENARYO 2:", "## SENARYO 3:" biçiminde yaz.
          - Her senaryoda başlık/amaç, süre/format, ilk 3 saniye kancası, zaman kodlu konuşma ve çekim akışı, ekran notları, kapanış/CTA, Shorts/Reels kesiti, SEO başlığı, açıklama ilk cümlesi, etiketler, playlist ve gerekiyorsa profile ve kaynak metne uygun somut alan bilgisi bulunsun.
          - Her senaryoda en fazla üç maddelik "Uygulanan QC düzeltmeleri" bölümü bulunsun; yalnızca gerçekten yapılan değişiklikleri yaz.
          - Yalnızca nihai Markdown metnini döndür; kod çiti veya ön açıklama ekleme.
          PROMPT

          jq -n \
            --rawfile base /tmp/base-scripts.md \
            --rawfile qc /tmp/qc-report.md \
            --rawfile final_check /tmp/final-technical-report.md \
            --arg base_url "$BASE_URL" \
            --arg qc_url "$QC_URL" \
            --arg final_check_url "$FINAL_CHECK_URL" \
            -r \
            '(
              "TEMEL SENARYO METNİ — " + $base_url + "\n\n" + $base +
              "\n\nKALİTE KONTROL RAPORU — " + $qc_url + "\n\n" + $qc +
              (if ($final_check | length) > 0 then
                "\n\nSON TEKNİK KONTROL RAPORU — " + $final_check_url + "\n\n" + $final_check
              else "" end)
            )' > /tmp/weekly-script-correction-prompt.txt

      - name: Cost guard ön kontrolü (preflight)
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # Fail before spending any real provider tokens if the cost-guard
          # config itself is broken/unreadable.
          python3 -c "
          import json
          config = json.load(open('.github/config/cost-guard.json', encoding='utf-8'))
          limits = config['limits']
          for key in ('max_provider_attempts', 'max_input_tokens', 'max_output_tokens', 'max_total_tokens'):
              assert isinstance(limits[key], int) and limits[key] > 0, f'invalid limit: {key}'
          assert isinstance(config['monetary']['enabled'], bool)
          print('Cost guard preflight: config gecerli.')
          "

      - name: AI Router ile senaryoları tek çağrıda düzelt
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # Router, provider'lardan hiçbiri kullanılamıyorsa (eksik anahtar
          # dahil) diğerini otomatik dener — bu yüzden yalnız
          # ANTHROPIC_API_KEY'in varlığını arayan eski sabit ön kontrol
          # kaldırıldı; asıl fail-closed garanti aşağıdaki
          # provider/model/çıktı kontrolüdür.

          # Real-AI-budget-cap mode: fail closed BEFORE the provider call if
          # the worst-case cost of this exact prompt would exceed this
          # stage's slice of the chain's $0.50 hard cap, and force
          # single-provider (Anthropic-only) routing so no retry/fallback can
          # spend on an unpriced provider outside this guard's visibility.
          ROUTER_EXTRA_ARGS=()
          if [[ "$REAL_AI_BUDGET_CAP" == "true" ]]; then
            python3 .github/scripts/preflight_budget_guard.py \
              --stage correction \
              --provider anthropic \
              --model "$DEFAULT_MODEL" \
              --web-search-max-uses 0 \
              --prompt-file /tmp/weekly-script-correction-prompt.txt \
              --system-file /tmp/system-prompt.txt \
              --profile .github/config/business-profile.json \
              --budget-config .github/config/real-ai-budget.json \
              --price-config .github/config/cost-guard.json
            ROUTER_EXTRA_ARGS+=(--provider-order anthropic)
          fi

          python3 .github/scripts/ai_router.py \
            --config .github/config/ai-router.json \
            --system-file /tmp/system-prompt.txt \
            --prompt-file /tmp/weekly-script-correction-prompt.txt \
            --output-file /tmp/final-scripts.md \
            --meta-file /tmp/weekly-script-correction-meta.json \
            --max-tokens "$CORRECTION_MAX_MODEL_OUTPUT" \
            --primary-model "$DEFAULT_MODEL" \
            "${ROUTER_EXTRA_ARGS[@]}"

          CORRECTION_AI_PROVIDER=$(jq -r '.provider // ""' /tmp/weekly-script-correction-meta.json)
          CORRECTION_AI_MODEL=$(jq -r '.model // ""' /tmp/weekly-script-correction-meta.json)
          STOP_REASON=$(jq -r '.stop_reason // ""' /tmp/weekly-script-correction-meta.json)

          if [[ -z "$CORRECTION_AI_PROVIDER" || -z "$CORRECTION_AI_MODEL" || ! -s /tmp/final-scripts.md ]]; then
            echo "Router geçerli provider/model/senaryo üretmedi."
            exit 1
          fi

          # ai_router.py'nin usable() kabul kriteri bu iş akışının kendi
          # sıkı end_turn kontrolünden daha gevşektir; migration'ın
          # davranışı sessizce gevşetmemesi için aynı sıkı kontrol burada
          # seçilen sağlayıcının gerçek stop_reason'ı üzerinde korunur.
          if [[ "$STOP_REASON" != "end_turn" ]]; then
            echo "Model çıktısı güvenli biçimde tamamlanmadı: provider=$CORRECTION_AI_PROVIDER stop_reason=$STOP_REASON"
            exit 1
          fi

          # Cost guard kullanım doğrulaması (postflight) — bu run'ın gerçek
          # kullanımı yapılandırılmış sınırı aştıysa aşağıdaki hiçbir ileri
          # adım çalışmadan işi kapalı (fail-closed) durdurur.
          python3 .github/scripts/cost_guard.py \
            --meta-file /tmp/weekly-script-correction-meta.json \
            --config .github/config/cost-guard.json

          EXPECTED_HEADING="# 🎬 $BRAND_NAME — NİHAİ SENARYOLAR"
          if [[ "$(head -n 1 /tmp/final-scripts.md)" != "$EXPECTED_HEADING" ]]; then
            echo "Nihai çıktı başlığı sözleşmeyle eşleşmiyor."
            exit 1
          fi

          SCENARIO_HEADINGS=$(grep -Ec '^## SENARYO [123]:' /tmp/final-scripts.md || true)
          QC_SECTIONS=$(grep -c 'Uygulanan QC düzeltmeleri' /tmp/final-scripts.md || true)
          if [[ "$SCENARIO_HEADINGS" -ne "$CORRECTION_SCENARIO_COUNT" || "$QC_SECTIONS" -ne "$CORRECTION_SCENARIO_COUNT" ]]; then
            echo "Nihai çıktı tam üç senaryo veya üç QC özeti içermiyor."
            exit 1
          fi

          # Downstream builders (build_subtitle_package.py, build_thumbnail_
          # package.py, build_youtube_package.py) extract each **[KANCA]** /
          # **[ANA AKIŞ]** / **[KAPANIŞ VE CTA]** / **[SHORTS KESİTİ]** block
          # from the FULL, un-narrowed Nihai Senaryolar body by scanning
          # forward to the next literal "---" line (or end of document) —
          # they never stop at the next "## SENARYO" heading. Nothing in
          # this workflow's own output contract has ever required a "---"
          # between scenario sections, so a 3-scenario body with no
          # separators would make every one of those extractions silently
          # spill from SENARYO 1 through SENARYO 2 and 3. Fail closed here,
          # before this becomes anyone's real editing/subtitle/thumbnail/
          # YouTube package.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          text = Path("/tmp/final-scripts.md").read_text(encoding="utf-8")
          scenario_count = int(os.environ["CORRECTION_SCENARIO_COUNT"])
          headings = list(re.finditer(r"(?m)^## SENARYO ([123]):", text))
          if len(headings) != scenario_count:
              raise SystemExit("Ayraç kontrolü: senaryo başlığı sayısı beklenenle eşleşmiyor.")

          for index, heading in enumerate(headings):
              is_last = index == len(headings) - 1
              end = headings[index + 1].start() if not is_last else len(text)
              block = text[heading.start():end]
              if not is_last and not re.search(r"(?m)^---\s*$", block):
                  raise SystemExit(
                      f"SENARYO {heading.group(1)} ile bir sonraki senaryo arasında "
                      "\"---\" ayracı yok; alt akış (altyazı/thumbnail/YouTube) "
                      "çıkarımı yanlış senaryoya taşabilir."
                  )
          print("scenario_separator_check_ok")
          PY

          INPUT_TOKENS=$(jq -r '.total_input_tokens // .input_tokens // 0' /tmp/weekly-script-correction-meta.json)
          OUTPUT_TOKENS=$(jq -r '.total_output_tokens // .output_tokens // 0' /tmp/weekly-script-correction-meta.json)
          {
            echo "CORRECTION_AI_PROVIDER=$CORRECTION_AI_PROVIDER"
            echo "CORRECTION_AI_MODEL=$CORRECTION_AI_MODEL"
            echo "CORRECTION_INPUT_TOKENS=$INPUT_TOKENS"
            echo "CORRECTION_OUTPUT_TOKENS=$OUTPUT_TOKENS"
          } >> "$GITHUB_ENV"

      - name: Nihai senaryoları Issue olarak yayınla
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_DATE=$(TZ="$BUSINESS_TIMEZONE" date +%d-%m-%Y)
          TITLE="Nihai Senaryolar - $RUN_DATE"

          {
            echo "<!-- CORRECTION_AI_USAGE_V1 source_chars=$CORRECTION_SOURCE_CHARS input=$CORRECTION_INPUT_TOKENS output=$CORRECTION_OUTPUT_TOKENS web_search=0 provider=$CORRECTION_AI_PROVIDER model=$CORRECTION_AI_MODEL source_mode=$SOURCE_MODE profile_sha=$PROFILE_FILE_SHA -->"
            echo "> **Durum:** ⏳ $OWNER_NAME onayı bekleniyor"
            echo
            echo "**Temel alınan metin:** $BASE_URL"
            echo "**Kaynak haftalık senaryolar:** $SCRIPT_URL"
            echo "**Kalite kontrol raporu:** $QC_URL"
            if [[ "$FINAL_CHECK_URL" != "Yok" ]]; then
              echo "**Eşleştirilmiş son teknik kontrol:** $FINAL_CHECK_URL"
            fi
            echo
            cat /tmp/final-scripts.md
            echo
            echo "---"
            echo "Onaylamak için bu Issue'ya **$APPROVAL_COMMAND** yaz."
          } > /tmp/issue-body.md

          gh label create "eren-onayi-bekliyor" \
            --color "FBCA04" \
            --description "Nihai içerik işletme sahibi onayını bekliyor" \
            --force

          gh label create "owner-approval-pending" \
            --color "FBCA04" \
            --description "Nihai içerik işletme sahibi onayını bekliyor" \
            --force

          EXISTING_NUMBER=$(gh issue list \
            --state all \
            --search "\"$TITLE\" in:title sort:updated-desc" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" \
            | head -n 1)

          if [[ -n "$EXISTING_NUMBER" ]]; then
            gh issue edit "$EXISTING_NUMBER" \
              --title "$TITLE" \
              --body-file /tmp/issue-body.md \
              --add-label "eren-onayi-bekliyor" \
              --add-label "owner-approval-pending"
            ISSUE_URL=$(gh issue view "$EXISTING_NUMBER" --json url --jq '.url')
          else
            ISSUE_URL=$(gh issue create \
              --title "$TITLE" \
              --body-file /tmp/issue-body.md \
              --label "eren-onayi-bekliyor" \
              --label "owner-approval-pending")
          fi

          {
            echo "### Düzeltme ajanı tamamlandı"
            echo "- Kaynak senaryolar: #$SCRIPT_NUMBER"
            echo "- Kalite raporu: #$QC_NUMBER"
            echo "- Temel kaynak modu: $SOURCE_MODE"
            echo "- Kaynak karakteri: $CORRECTION_SOURCE_CHARS"
            echo "- AI kullanımı: $CORRECTION_INPUT_TOKENS giriş / $CORRECTION_OUTPUT_TOKENS çıkış tokenı"
            echo "- Web araması: 0"
            echo "- Nihai çıktı: $ISSUE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
