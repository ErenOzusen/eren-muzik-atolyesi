name: Çekim Handoff Güvenlik Kapısı

"on":
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Nihai Senaryolar Issue numarası"
        required: true
        type: string
      scenario:
        description: "Beklenen seçilmiş senaryo: 1, 2 veya 3"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      test_mode:
        description: "Yalnız doğrulama; AI/Issue değişikliği yok"
        required: true
        default: true
        type: boolean
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: filming-handoff-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  validate-handoff:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.issue.title, 'Nihai Senaryolar') &&
       (startsWith(github.event.comment.body, 'TEST HANDOFF ') ||
        startsWith(github.event.comment.body, 'TEST ÇEKİMİ BAŞLAT ') ||
        startsWith(github.event.comment.body, 'ÇEKİMİ BAŞLAT ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Handoff girdilerini güvenli biçimde çöz
        shell: bash
        run: |
          set -euo pipefail

          START_FILMING=false
          DISPATCH_TEST=false
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PROFILE=.github/config/business-profile.json
            EXPECTED_OWNER=$(jq -r '.business.github_owner' "$PROFILE")
            COMMENT_AUTHOR=$(jq -r '.comment.user.login // ""' "$GITHUB_EVENT_PATH")
            RAW_COMMENT=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
            NORMALIZED=$(printf '%s' "$RAW_COMMENT" | tr '[:lower:]' '[:upper:]' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/[[:space:]]+/ /g')

            if [[ "$COMMENT_AUTHOR" != "$EXPECTED_OWNER" ]]; then
              echo "Handoff komutu yalnız yetkili işletme sahibi tarafından verilebilir: $COMMENT_AUTHOR"
              exit 1
            fi

            if [[ "$NORMALIZED" =~ ^TEST[[:space:]]+HANDOFF[[:space:]]+([123])$ ]]; then
              EXPECTED_SCENARIO="${BASH_REMATCH[1]}"
              TEST_MODE=true
            elif [[ "$NORMALIZED" =~ ^TEST[[:space:]]+ÇEKİMİ[[:space:]]+BAŞLAT[[:space:]]+([123])$ ]]; then
              EXPECTED_SCENARIO="${BASH_REMATCH[1]}"
              TEST_MODE=true
              DISPATCH_TEST=true
            elif [[ "$NORMALIZED" =~ ^ÇEKİMİ[[:space:]]+BAŞLAT[[:space:]]+([123])$ ]]; then
              EXPECTED_SCENARIO="${BASH_REMATCH[1]}"
              TEST_MODE=false
              START_FILMING=true
            else
              echo "Yorum geçerli handoff komutu değil."
              exit 1
            fi

            ISSUE_NUMBER="${{ github.event.issue.number }}"
          else
            ISSUE_NUMBER="${{ inputs.issue_number }}"
            EXPECTED_SCENARIO="${{ inputs.scenario }}"
            TEST_MODE="${{ inputs.test_mode }}"
          fi

          {
            echo "ISSUE_NUMBER=$ISSUE_NUMBER"
            echo "EXPECTED_SCENARIO=$EXPECTED_SCENARIO"
            echo "TEST_MODE=$TEST_MODE"
            echo "START_FILMING=$START_FILMING"
            echo "DISPATCH_TEST=$DISPATCH_TEST"
          } >> "$GITHUB_ENV"

      - name: Issue ve seçim sözleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Issue numarası geçersiz: $ISSUE_NUMBER"
            exit 1
          fi
          if [[ ! "$EXPECTED_SCENARIO" =~ ^[123]$ ]]; then
            echo "Senaryo yalnız 1, 2 veya 3 olabilir."
            exit 1
          fi

          gh issue view "$ISSUE_NUMBER" --json title,body,url,labels,state > /tmp/issue.json
          TITLE=$(jq -r '.title // ""' /tmp/issue.json)
          URL=$(jq -r '.url // ""' /tmp/issue.json)
          STATE=$(jq -r '.state // ""' /tmp/issue.json)
          jq -r '.body // ""' /tmp/issue.json > /tmp/body.md
          jq -r '.labels[].name' /tmp/issue.json > /tmp/labels.txt

          if [[ "$TITLE" != Nihai\ Senaryolar* ]]; then
            echo "Kaynak Issue Nihai Senaryolar değil: $TITLE"
            exit 1
          fi

          if ! grep -Eiq "^##[[:space:]]+SENARYO[[:space:]]+$EXPECTED_SCENARIO([^0-9]|$)" /tmp/body.md; then
            echo "Beklenen SENARYO $EXPECTED_SCENARIO kaynak Issue içinde bulunamadı."
            exit 1
          fi

          if [[ "$TEST_MODE" == "true" ]]; then
            if ! grep -qx 'sistem-testi' /tmp/labels.txt; then
              echo "Test modu yalnız sistem-testi etiketli Issue üzerinde çalışabilir."
              exit 1
            fi
            {
              echo "### Çekim handoff kapısı — 0-token test başarılı"
              echo "- Kaynak: $URL"
              echo "- Issue: $ISSUE_NUMBER"
              echo "- Beklenen senaryo: $EXPECTED_SCENARIO"
              echo "- AI kullanımı: 0 token"
              echo "- Web araması: 0"
              echo "- Issue/etiket değişikliği: yok"
              if [[ "$DISPATCH_TEST" == "true" ]]; then
                echo "- Sonraki adım: Router'lı Çekim Paketi Ajanına test_mode=true dispatch edilecek"
              else
                echo "- Çekim Paketi Ajanı: başlatılmadı"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ "$STATE" != "OPEN" ]]; then
              echo "Gerçek üretim yalnız açık Nihai Senaryolar Issue'sundan başlatılabilir: state=$STATE"
              exit 1
            fi
            if grep -qx 'sistem-testi' /tmp/labels.txt; then
              echo "Sistem testi gerçek üretim handoff'una giremez."
              exit 1
            fi

            for REQUIRED in eren-onayli cekime-hazir uretime-secildi; do
              if [[ "$REQUIRED" == "eren-onayli" ]]; then
                if ! grep -qxE 'eren-onayli|owner-approved' /tmp/labels.txt; then
                  echo "Gerçek handoff için zorunlu etiket eksik: $REQUIRED"
                  exit 1
                fi
              elif [[ "$REQUIRED" == "cekime-hazir" ]]; then
                if ! grep -qxE 'cekime-hazir|production-ready' /tmp/labels.txt; then
                  echo "Gerçek handoff için üretime hazır durumu eksik: cekime-hazir/production-ready"
                  exit 1
                fi
              elif [[ "$REQUIRED" == "uretime-secildi" ]]; then
                if ! grep -qxE 'uretime-secildi|production-selected' /tmp/labels.txt; then
                  echo "Gerçek handoff için üretim seçimi etiketi eksik: uretime-secildi/production-selected"
                  exit 1
                fi
              elif ! grep -qx "$REQUIRED" /tmp/labels.txt; then
                echo "Gerçek handoff için zorunlu etiket eksik: $REQUIRED"
                exit 1
              fi
            done

            if grep -qx 'duzeltme-gerekiyor' /tmp/labels.txt; then
              echo "Düzeltme gereken içerik çekime devredilemez."
              exit 1
            fi

            mapfile -t LEGACY_SELECTION_LABELS < <(grep -E '^uretim-senaryo-[123]$' /tmp/labels.txt || true)
            mapfile -t GENERIC_SELECTION_LABELS < <(grep -E '^production-scenario-[123]$' /tmp/labels.txt || true)
            if [[ "${#LEGACY_SELECTION_LABELS[@]}" -gt 1 || "${#GENERIC_SELECTION_LABELS[@]}" -gt 1 ]]; then
              echo "Birden fazla üretim senaryosu etiketi bulundu: legacy=${#LEGACY_SELECTION_LABELS[@]} generic=${#GENERIC_SELECTION_LABELS[@]}"
              exit 1
            fi
            if [[ "${#LEGACY_SELECTION_LABELS[@]}" -eq 0 && "${#GENERIC_SELECTION_LABELS[@]}" -eq 0 ]]; then
              echo "Üretim senaryosu etiketi bulunamadı."
              exit 1
            fi

            LEGACY_SCENARIO=""
            GENERIC_SCENARIO=""
            if [[ "${#LEGACY_SELECTION_LABELS[@]}" -eq 1 ]]; then
              LEGACY_SCENARIO="${LEGACY_SELECTION_LABELS[0]##*-}"
            fi
            if [[ "${#GENERIC_SELECTION_LABELS[@]}" -eq 1 ]]; then
              GENERIC_SCENARIO="${GENERIC_SELECTION_LABELS[0]##*-}"
            fi
            if [[ -n "$LEGACY_SCENARIO" && -n "$GENERIC_SCENARIO" && "$LEGACY_SCENARIO" != "$GENERIC_SCENARIO" ]]; then
              echo "Legacy/generic üretim senaryosu etiketleri uyuşmuyor: legacy=$LEGACY_SCENARIO generic=$GENERIC_SCENARIO"
              exit 1
            fi

            ACTUAL_SCENARIO="${LEGACY_SCENARIO:-$GENERIC_SCENARIO}"
            if [[ "$ACTUAL_SCENARIO" != "$EXPECTED_SCENARIO" ]]; then
              echo "Handoff uyuşmazlığı: beklenen=$EXPECTED_SCENARIO etiket=$ACTUAL_SCENARIO"
              exit 1
            fi

            # The handoff marker must match the CURRENT body content, not just
            # the issue/scenario numbers — otherwise a stale marker posted
            # before a later content edit (which approval-invalidation-
            # gate.yml already clears the selection labels for, but a marker
            # comment itself is never deleted) could still authorize a real
            # filming handoff for content nobody actually re-selected with a
            # fresh SEÇ N after the edit.
            CURRENT_BODY_SHA=$(sha256sum /tmp/body.md | awk '{print $1}')
            gh issue view "$ISSUE_NUMBER" --comments --json comments --jq '.comments[].body // ""' > /tmp/comments.txt
            HANDOFF_MARKER="<!-- FILMING_HANDOFF_V1 issue=$ISSUE_NUMBER scenario=$EXPECTED_SCENARIO body_sha256=$CURRENT_BODY_SHA -->"
            if ! grep -Fqx "$HANDOFF_MARKER" /tmp/comments.txt; then
              echo "Seçim Kapısının geçerli (güncel içerik revizyonuna bağlı) handoff işareti bulunamadı; içerik SEÇ $EXPECTED_SCENARIO sonrasında değişmiş olabilir."
              exit 1
            fi

            {
              echo "### Çekim handoff kapısı — üretim doğrulaması başarılı"
              echo "- Kaynak: $URL"
              echo "- Issue: $ISSUE_NUMBER"
              echo "- Senaryo: $ACTUAL_SCENARIO"
              echo "- State: $STATE"
              echo "- AI kullanımı (kapı): 0 token"
              echo "- Seçim Kapısı işareti: doğrulandı"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Video Orchestrator kararını seçilen senaryodan üret
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile .github/scripts/video_orchestrator.py
          python3 -m json.tool .github/config/video-orchestrator.json >/dev/null
          python3 .github/scripts/test_video_orchestrator.py
          python3 .github/scripts/test_video_engine_routing_contract.py

          export EXPECTED_SCENARIO
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          text = Path('/tmp/body.md').read_text(encoding='utf-8')
          n = os.environ['EXPECTED_SCENARIO']
          headings = list(re.finditer(r'(?mi)^##\s+SENARYO\s+([123]):.*$', text))
          matches = [h for h in headings if h.group(1) == n]
          if len(matches) != 1:
              raise SystemExit(f'SENARYO {n} tam bir kez bulunmalı; bulunan: {len(matches)}')
          start = matches[0].start()
          later = [h for h in headings if h.start() > start]
          end = later[0].start() if later else len(text)
          block = text[start:end]
          separator = re.search(r'(?m)^---\s*$', block)
          if separator:
              block = block[:separator.start()]
          block = re.sub(r'<!--.*?-->', '', block, flags=re.S)
          block = re.sub(r'\n{3,}', '\n\n', block).strip() + '\n'
          if len(block) < 40:
              raise SystemExit('Seçilen senaryo Orchestrator için fazla kısa.')
          Path('/tmp/orchestrator-input.md').write_text(block, encoding='utf-8')
          PY

          python3 .github/scripts/video_orchestrator.py \
            --config .github/config/video-orchestrator.json \
            --input-file /tmp/orchestrator-input.md \
            --output-file /tmp/video-route.json \
            --mode auto

          jq -e '.paid_generation_allowed == false' /tmp/video-route.json >/dev/null
          jq -e '.dispatch_enabled == false' /tmp/video-route.json >/dev/null

          VIDEO_MODE=$(jq -r '.selected_mode' /tmp/video-route.json)
          VIDEO_ENGINE=$(jq -r '.engine' /tmp/video-route.json)
          VIDEO_NEXT_STAGE=$(jq -r '.next_stage' /tmp/video-route.json)
          VIDEO_REQUIRES_RAW=$(jq -r '.requires_raw_video' /tmp/video-route.json)
          VIDEO_REASON=$(jq -r '.reason' /tmp/video-route.json)

          case "$VIDEO_MODE" in
            human|hybrid|faceless) ;;
            *) echo "Auto Orchestrator güvenli olmayan mod seçti: $VIDEO_MODE"; exit 1 ;;
          esac

          {
            echo "VIDEO_MODE=$VIDEO_MODE"
            echo "VIDEO_ENGINE=$VIDEO_ENGINE"
            echo "VIDEO_NEXT_STAGE=$VIDEO_NEXT_STAGE"
            echo "VIDEO_REQUIRES_RAW=$VIDEO_REQUIRES_RAW"
            echo "VIDEO_REASON=$VIDEO_REASON"
          } >> "$GITHUB_ENV"

          {
            echo "### Video Orchestrator — 0-token karar"
            echo "- Mod: $VIDEO_MODE"
            echo "- Motor: $VIDEO_ENGINE"
            echo "- Ham video gerekli: $VIDEO_REQUIRES_RAW"
            echo "- Sıradaki aşama: $VIDEO_NEXT_STAGE"
            echo "- Neden: $VIDEO_REASON"
            echo "- Ücretli üretim: kapalı"
            echo "- Motor dispatch: kapalı"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gerçek modda Orchestrator kararını Nihai Senaryolara kaydet
        if: env.TEST_MODE != 'true' && env.START_FILMING == 'true'
        shell: bash
        run: |
          set -euo pipefail

          MARKER="<!-- VIDEO_ORCHESTRATOR_V1 issue=$ISSUE_NUMBER scenario=$EXPECTED_SCENARIO -->"
          gh issue view "$ISSUE_NUMBER" --comments --json comments --jq '.comments[].body // ""' > /tmp/route-comments.txt

          for label in video-route-human video-route-hybrid video-route-faceless; do
            gh label create "$label" --color "5319E7" --description "Video Orchestrator üretim rotası" --force
            gh issue edit "$ISSUE_NUMBER" --remove-label "$label" >/dev/null 2>&1 || true
          done

          ROUTE_LABEL="video-route-$VIDEO_MODE"
          gh issue edit "$ISSUE_NUMBER" --add-label "$ROUTE_LABEL"
          gh label create "video-route-decided" --color "0E8A16" --description "Video Orchestrator rota kararı hazır" --force
          gh issue edit "$ISSUE_NUMBER" --add-label "video-route-decided"

          if ! grep -Fqx "$MARKER" /tmp/route-comments.txt; then
            cat > /tmp/route-comment.md <<EOF
          $MARKER
          ## 🧭 Video Orchestrator Kararı

          - **Seçilen senaryo:** $EXPECTED_SCENARIO
          - **Üretim modu:** \`$VIDEO_MODE\`
          - **Önerilen motor:** \`$VIDEO_ENGINE\`
          - **Ham video gerekli:** \`$VIDEO_REQUIRES_RAW\`
          - **Sıradaki aşama:** \`$VIDEO_NEXT_STAGE\`
          - **Karar nedeni:** \`$VIDEO_REASON\`
          - **Ücretli üretim:** ❌ Kapalı
          - **Video motoru otomatik başlatma:** ❌ Kapalı

          > Orchestrator yalnız rota kararı verdi. Video sağlayıcısı çağrılmadı ve ücretli video üretimi başlamadı.
          EOF
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/route-comment.md
          fi

      - name: Router'lı Çekim Paketi Ajanına 0-token test dispatch gönder
        if: env.TEST_MODE == 'true' && env.DISPATCH_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg issue "$ISSUE_NUMBER" \
            --arg scenario "$EXPECTED_SCENARIO" \
            '{ref:"main",inputs:{test_mode:true,test_issue_number:$issue,test_scenario:$scenario}}' > /tmp/test-dispatch.json

          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GH_REPO/actions/workflows/filming-package-agent-v4-router.yml/dispatches" \
            --input /tmp/test-dispatch.json

          {
            echo "### 0-token Router dispatch gönderildi"
            echo "- Test kaynak Issue: #$ISSUE_NUMBER"
            echo "- Test senaryosu: $EXPECTED_SCENARIO"
            echo "- Router'lı Çekim Paketi Ajanı test_mode=true"
            echo "- Hiçbir AI sağlayıcısına canlı çağrı beklenmiyor"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Router'lı Çekim Paketi Ajanını kesin handoff ile başlat
        if: env.TEST_MODE != 'true' && env.START_FILMING == 'true'
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg issue "$ISSUE_NUMBER" \
            --arg scenario "$EXPECTED_SCENARIO" \
            '{ref:"main",inputs:{test_mode:false,source_issue_number:$issue,source_scenario:$scenario}}' > /tmp/dispatch.json

          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GH_REPO/actions/workflows/filming-package-agent-v4-router.yml/dispatches" \
            --input /tmp/dispatch.json

          {
            echo "### Router'lı Çekim Paketi Ajanı başlatıldı"
            echo "- Kesin kaynak Issue: #$ISSUE_NUMBER"
            echo "- Kesin senaryo: $EXPECTED_SCENARIO"
            echo "- Video modu: $VIDEO_MODE"
            echo "- Önerilen video motoru: $VIDEO_ENGINE"
            echo "- Başlatma komutu: Yetkili işletme sahibi tarafından açıkça verildi"
            echo "- Bu kapıda AI kullanımı: 0 token"
            echo "- Çekim Paketi AI sağlayıcısı ayrı Router tarafından seçilecek"
            echo "- Video motoru henüz başlatılmıyor"
          } >> "$GITHUB_STEP_SUMMARY"
