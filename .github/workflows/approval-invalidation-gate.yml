name: Eski Onay Geçersizleştirme Kapısı

on:
  issues:
    types:
      - edited

permissions:
  contents: read
  issues: write

concurrency:
  group: approval-invalidation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  invalidate-stale-approval:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, 'Nihai Senaryolar') &&
      github.event.changes.body != null
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: İçerik değişikliğinde eski onayı geçersizleştir
        shell: bash
        run: |
          set -euo pipefail

          gh issue view "$ISSUE_NUMBER" --json labels,url > /tmp/issue.json
          jq -r '.labels[].name' /tmp/issue.json > /tmp/labels.txt
          ISSUE_URL=$(jq -r '.url' /tmp/issue.json)

          # This list intentionally spans every downstream state a body edit can
          # make stale: not just approval/ready labels, but also production
          # SELECTION (uretime-secildi/production-selected + the specific
          # uretim-senaryo-N/production-scenario-N picked) and the Video
          # Orchestrator's recorded ROUTE (video-route-*). Without this, an
          # owner could edit approved content, get re-approved, and have the
          # OLD scenario selection / OLD FILMING_HANDOFF_V1 comment silently
          # keep authorizing a real filming handoff for content nobody
          # actually re-selected with a fresh SEÇ N — see filming-handoff-
          # gate.yml's body_sha256-bound marker check, which is this fix's
          # second, independent layer against exactly that gap.
          HAD_APPROVAL=false
          for LABEL in eren-onayli owner-approved cekime-hazir cekim-paketi-hazir production-ready filming-package-ready uretime-secildi production-selected uretim-senaryo-1 uretim-senaryo-2 uretim-senaryo-3 production-scenario-1 production-scenario-2 production-scenario-3 video-route-human video-route-hybrid video-route-faceless video-route-decided; do
            if grep -qx "$LABEL" /tmp/labels.txt; then
              HAD_APPROVAL=true
            fi
          done

          if [[ "$HAD_APPROVAL" != "true" ]]; then
            echo "Bu içerikte geçersizleştirilecek eski onay yok."
            exit 0
          fi

          # ---- PENDING FIRST: onaylı/hazır durum kaldırılmadan önce bekliyor durumu kurulur ve doğrulanır ----

          gh label create "eren-onayi-bekliyor" \
            --color "FBCA04" \
            --description "Nihai içerik işletme sahibi onayını bekliyor" \
            --force

          gh label create "owner-approval-pending" \
            --color "FBCA04" \
            --description "Nihai içerik işletme sahibi onayını bekliyor" \
            --force

          gh issue edit "$ISSUE_NUMBER" \
            --add-label "eren-onayi-bekliyor" \
            --add-label "owner-approval-pending" > /dev/null

          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' \
            > /tmp/labels-after-pending.txt

          for PENDING_LABEL in eren-onayi-bekliyor owner-approval-pending; do
            if ! grep -qx "$PENDING_LABEL" /tmp/labels-after-pending.txt; then
              echo "Pending durumu doğrulanamadı; onaylı etiketler kaldırılmadan durduruluyor: $PENDING_LABEL eksik."
              exit 1
            fi
          done

          # ---- Pending doğrulandıktan sonra eski onaylı/hazır durum tek toplu mutasyonla kaldırılır ----

          REMOVE_ARGS=()
          for LABEL in eren-onayli owner-approved cekime-hazir cekim-paketi-hazir production-ready filming-package-ready uretime-secildi production-selected uretim-senaryo-1 uretim-senaryo-2 uretim-senaryo-3 production-scenario-1 production-scenario-2 production-scenario-3 video-route-human video-route-hybrid video-route-faceless video-route-decided; do
            if grep -qx "$LABEL" /tmp/labels.txt; then
              REMOVE_ARGS+=(--remove-label "$LABEL")
            fi
          done
          if [[ "${#REMOVE_ARGS[@]}" -gt 0 ]]; then
            gh issue edit "$ISSUE_NUMBER" "${REMOVE_ARGS[@]}" > /dev/null
          fi

          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' \
            > /tmp/labels-final.txt

          for REQUIRED_PRESENT in eren-onayi-bekliyor owner-approval-pending; do
            if ! grep -qx "$REQUIRED_PRESENT" /tmp/labels-final.txt; then
              echo "Beklenen nihai durum sağlanamadı; gerekli etiket eksik: $REQUIRED_PRESENT"
              exit 1
            fi
          done

          for REQUIRED_ABSENT in eren-onayli owner-approved cekime-hazir cekim-paketi-hazir production-ready filming-package-ready uretime-secildi production-selected uretim-senaryo-1 uretim-senaryo-2 uretim-senaryo-3 production-scenario-1 production-scenario-2 production-scenario-3 video-route-human video-route-hybrid video-route-faceless video-route-decided; do
            if grep -qx "$REQUIRED_ABSENT" /tmp/labels-final.txt; then
              echo "Beklenen nihai durum sağlanamadı; kaldırılması gereken etiket hâlâ mevcut: $REQUIRED_ABSENT"
              exit 1
            fi
          done

          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<'MESSAGE'
          ## 🔄 Önceki Eren onayı geçersizleştirildi

          Nihai senaryo içeriği değiştirildiği için önceki onay, çekime-hazır durumu, üretim seçimi ve çekim handoff'u artık geçerli değil.

          **Durum:** Eren onayı yeniden bekleniyor.
          **Gerekli işlem:** İçerik yeniden onaylandıktan sonra üretim seçimi için `SEÇ N` yeniden çalıştırılmalı — eski seçim otomatik olarak geçerli sayılmaz.
          **Güvenlik:** Hiçbir sonraki ajan otomatik başlatılmadı.
          MESSAGE
          )"

          {
            echo "### Eski onay geçersizleştirildi"
            echo "- Issue: $ISSUE_URL"
            echo "- Kaldırılan durumlar: mevcut olan onay/hazır/üretim-seçimi/rota etiketleri (eren-onayli, owner-approved, cekime-hazir, cekim-paketi-hazir, production-ready, filming-package-ready, uretime-secildi, production-selected, uretim-senaryo-N, production-scenario-N, video-route-*)"
            echo "- Yeni durum: eren-onayi-bekliyor / owner-approval-pending"
            echo "- Üretim seçimi: geçersiz kılındı — yeniden onaydan sonra SEÇ N yeniden gerekli"
            echo "- Sonraki ajan: otomatik başlatılmadı"
            echo "- AI kullanımı: 0 giriş / 0 çıkış tokenı"
          } >> "$GITHUB_STEP_SUMMARY"
