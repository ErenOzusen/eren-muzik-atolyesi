name: İşletme Sahibi Onay Kapısı

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: eren-approval-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve-content:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, 'Nihai Senaryolar')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Merkezi onay ayarlarını doğrula
        shell: bash
        run: |
          set -euo pipefail

          PROFILE=.github/config/business-profile.json
          python3 .github/scripts/validate_business_config.py \
            --config "$PROFILE" \
            --output /tmp/approval-profile-validation.md \
            --test-mode true

          {
            echo "EXPECTED_OWNER=$(jq -r '.business.github_owner' "$PROFILE")"
            echo "OWNER_DISPLAY_NAME=$(jq -r '.business.owner_display_name' "$PROFILE")"
            echo "PRODUCTION_COMMAND=$(jq -r '.approval.production_command' "$PROFILE")"
            echo "TEST_COMMAND=$(jq -r '.approval.test_command' "$PROFILE")"
            echo "APPROVAL_REQUIRED=$(jq -r '.approval.required' "$PROFILE")"
            echo "ALLOW_UNAPPROVED=$(jq -r '.approval.allow_publication_without_owner_approval' "$PROFILE")"
            echo "PROFILE_FILE_SHA=$(sha256sum "$PROFILE" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: İşletme sahibi onayını güvenli biçimde doğrula ve kaydet
        shell: bash
        run: |
          set -euo pipefail

          normalize() {
            python3 -c 'import sys; print("".join(sys.stdin.read().split()).casefold())'
          }

          RAW_COMMENT=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
          COMMENT_AUTHOR=$(jq -r '.comment.user.login // ""' "$GITHUB_EVENT_PATH")
          NORMALIZED_COMMENT=$(printf '%s' "$RAW_COMMENT" | normalize)
          NORMALIZED_PRODUCTION=$(printf '%s' "$PRODUCTION_COMMAND" | normalize)
          NORMALIZED_TEST=$(printf '%s' "$TEST_COMMAND" | normalize)

          if [[ "$NORMALIZED_COMMENT" != "$NORMALIZED_PRODUCTION" \
             && "$NORMALIZED_COMMENT" != "$NORMALIZED_TEST" ]]; then
            echo "Yorum onay komutu değil; işlem yapılmadı."
            exit 0
          fi

          if [[ "$APPROVAL_REQUIRED" != "true" || "$ALLOW_UNAPPROVED" != "false" ]]; then
            echo "Merkezi profil onay güvenliği beklenen durumda değil."
            exit 1
          fi

          if [[ "$COMMENT_AUTHOR" != "$EXPECTED_OWNER" ]]; then
            echo "Onay komutu yetkili işletme sahibi tarafından yazılmadı: $COMMENT_AUTHOR"
            exit 1
          fi

          gh issue view "$ISSUE_NUMBER" --json title,body,labels,url > /tmp/approval-issue.json
          ISSUE_TITLE=$(jq -r '.title' /tmp/approval-issue.json)
          ISSUE_URL=$(jq -r '.url' /tmp/approval-issue.json)
          jq -r '.body // ""' /tmp/approval-issue.json > /tmp/approval-body.md
          jq -r '.labels[].name' /tmp/approval-issue.json > /tmp/approval-labels.txt

          if [[ "$ISSUE_TITLE" != Nihai\ Senaryolar* ]]; then
            echo "Onay hedefi Nihai Senaryolar Issue'su değil."
            exit 1
          fi

          if ! grep -Eq "^\*\*Kalite kontrol raporu:\*\* https://github\.com/${GH_REPO//\//\/}/issues/[0-9]+([[:space:]]*)$" /tmp/approval-body.md; then
            echo "Açık ve bu repoya ait Kalite Kontrol Raporu bağlantısı bulunamadı."
            exit 1
          fi

          if grep -qx 'duzeltme-gerekiyor' /tmp/approval-labels.txt; then
            echo "Issue hâlâ duzeltme-gerekiyor etiketini taşıyor; işletme sahibi onayı kaydedilemez."
            exit 1
          fi

          HAS_WAITING=false
          HAS_APPROVED=false
          grep -qxE 'eren-onayi-bekliyor|owner-approval-pending' /tmp/approval-labels.txt && HAS_WAITING=true || true
          grep -qxE 'eren-onayli|owner-approved' /tmp/approval-labels.txt && HAS_APPROVED=true || true

          if [[ "$HAS_WAITING" == "true" && "$HAS_APPROVED" == "true" ]]; then
            echo "Tutarsız onay durumu: Issue hem onaylı hem onay bekliyor. Önce eski onay geçersizleştirilmeli."
            exit 1
          fi

          BODY_SHA=$(sha256sum /tmp/approval-body.md | awk '{print $1}')

          if [[ "$NORMALIZED_COMMENT" == "$NORMALIZED_TEST" ]]; then
            {
              echo "### İşletme Sahibi Onay Kapısı — sıfır-token test başarılı"
              echo "- Issue: $ISSUE_URL"
              echo "- Yetkili kullanıcı: $COMMENT_AUTHOR"
              echo "- QC bağlantısı: doğrulandı"
              echo "- Düzeltme bloklayıcısı: yok"
              echo "- Onay bekliyor etiketi: $HAS_WAITING"
              echo "- Mevcut onay etiketi: $HAS_APPROVED"
              echo "- Issue gövde SHA-256: $BODY_SHA"
              echo "- AI kullanımı: 0 giriş / 0 çıkış tokenı"
              echo "- Issue/etiket değişikliği: yapılmadı"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$HAS_APPROVED" == "true" ]]; then
            echo "Bu içerik daha önce $OWNER_DISPLAY_NAME tarafından onaylanmış."
            exit 0
          fi

          if [[ "$HAS_WAITING" != "true" ]]; then
            echo "Issue eren-onayi-bekliyor etiketini taşımıyor; üretim onayı reddedildi."
            exit 1
          fi

          gh label create "eren-onayli" \
            --color "0E8A16" \
            --description "İçerik $OWNER_DISPLAY_NAME tarafından onaylandı" \
            --force

          gh label create "owner-approved" \
            --color "0E8A16" \
            --description "İçerik $OWNER_DISPLAY_NAME tarafından onaylandı" \
            --force

          gh label create "cekime-hazir" \
            --color "1D76DB" \
            --description "İçerik çekim aşamasına hazır" \
            --force

          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "eren-onayi-bekliyor" > /dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "owner-approval-pending" > /dev/null 2>&1 || true

          gh issue edit "$ISSUE_NUMBER" \
            --add-label "eren-onayli" \
            --add-label "owner-approved" \
            --add-label "cekime-hazir"

          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<MESSAGE
          <!-- EREN_APPROVAL_V2 body_sha256=$BODY_SHA profile_sha=$PROFILE_FILE_SHA -->
          ## ✅ İşletme sahibi onayı kaydedildi

          Nihai senaryolar $OWNER_DISPLAY_NAME tarafından onaylandı.

          **Durum:** Çekime hazır  
          **Sıradaki aşama:** Çekim paketi yalnızca manuel olarak çalıştırılabilir.
          MESSAGE
          )"

          {
            echo "### İşletme sahibi onayı güvenle kaydedildi"
            echo "- Issue: $ISSUE_URL"
            echo "- Yetkili kullanıcı: $COMMENT_AUTHOR"
            echo "- QC bağlantısı: doğrulandı"
            echo "- Issue gövde SHA-256: $BODY_SHA"
            echo "- Durum: Çekime hazır"
            echo "- Sonraki ajan: otomatik başlatılmadı"
            echo "- AI kullanımı: 0 giriş / 0 çıkış tokenı"
          } >> "$GITHUB_STEP_SUMMARY"
