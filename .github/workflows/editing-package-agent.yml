name: Kurgu Paketi Ajanı

"on":
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Videosuz güvenli test modu (gerçek teslim kayıtlarını değiştirmez)"
        required: true
        default: true
        type: boolean
      filming_package_issue:
        description: "Test modu için Çekim Paketi Issue numarası (örnek: 23)"
        required: false
        default: "23"
        type: string
      intake_issue:
        description: "Gerçek modda Ham Video Teslim Issue numarası; boşsa en güncel kayıt"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: editing-package-agent
  cancel-in-progress: false

jobs:
  create-editing-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL }}
      QWEN_CHAT_ENDPOINT: ${{ vars.QWEN_CHAT_ENDPOINT }}
      RUN_ACTOR: ${{ github.actor }}
      TEST_MODE: ${{ inputs.test_mode }}
      REQUESTED_PACKAGE_NUMBER: ${{ inputs.filming_package_issue }}
      REQUESTED_INTAKE_NUMBER: ${{ inputs.intake_issue }}
      EDITING_PACKAGE_VERSION: "4"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Router ve yapılandırmayı yerel doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/ai_router.py
          python3 -m json.tool .github/config/ai-router.json > /dev/null

      - name: Çalıştıranı ve çalışma modunu doğrula
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_OWNER=$(jq -er '.business.github_owner | select(type == "string" and length > 0)' \
            .github/config/business-profile.json)
          NORMALIZED_RUN_ACTOR=$(printf '%s' "$RUN_ACTOR" | LC_ALL=C tr '[:upper:]' '[:lower:]')
          NORMALIZED_CONFIG_OWNER=$(printf '%s' "$CONFIG_OWNER" | LC_ALL=C tr '[:upper:]' '[:lower:]')

          if [[ "$NORMALIZED_RUN_ACTOR" != "$NORMALIZED_CONFIG_OWNER" ]]; then
            echo "Bu ajanı yalnızca işletme profilinde yetkilendirilen GitHub hesabı çalıştırabilir."
            exit 1
          fi

          if [[ "$TEST_MODE" != "true" && "$TEST_MODE" != "false" ]]; then
            echo "test_mode yalnızca true veya false olabilir."
            exit 1
          fi

          if [[ "$TEST_MODE" == "true" ]]; then
            if [[ ! "$REQUESTED_PACKAGE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Test modu için geçerli bir Çekim Paketi Issue numarası gerekli."
              exit 1
            fi
          elif [[ -n "$REQUESTED_INTAKE_NUMBER" \
            && ! "$REQUESTED_INTAKE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Ham Video Teslim Issue numarası pozitif bir tam sayı olmalı."
            exit 1
          fi

      - name: Teslim kaydını veya videosuz test girdisini hazırla
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TEST_MODE" == "true" ]]; then
            PACKAGE_NUMBER="$REQUESTED_PACKAGE_NUMBER"
            INTAKE_NUMBER="TEST"
            INTAKE_URL="Videosuz sistem testi"

            cat > /tmp/intake.md <<'TEST_INTAKE'
          # 📥 VİDEOSUZ TEST TESLİMİ

          - Video biçimi: Ana video ve Shorts/Reels
          - Özel depolama yeri: Yerel cihaz
          - Dosya referansı: SISTEM-TESTI
          - Ham video dosyaları: TEST-video.mp4, TEST-shorts.mp4
          - Not: Gerçek video içermeyen kurgu planı testi

          Bu testte ham görüntü bulunmaz. Çıktı kesin kesim noktası veya izlenmiş video iddiası üretemez.
          TEST_INTAKE
          else
            if [[ -n "$REQUESTED_INTAKE_NUMBER" ]]; then
              INTAKE_NUMBER="$REQUESTED_INTAKE_NUMBER"
            else
              INTAKE_NUMBER=$(gh issue list \
                --state open \
                --label "ham-video-teslim" \
                --label "kurgu-bekliyor" \
                --search '"Ham Video Teslimi" in:title sort:updated-desc' \
                --limit 20 \
                --json number,title,updatedAt \
                --jq '[.[] | select(.title | startswith("Ham Video Teslimi - Çekim Paketi #"))]
                      | sort_by(.updatedAt) | reverse | .[0].number // empty')
            fi

            if [[ -z "$INTAKE_NUMBER" ]]; then
              echo "Kurgu bekleyen Ham Video Teslim Issue'su bulunamadı."
              exit 1
            fi

            gh issue view "$INTAKE_NUMBER" \
              --json title,body,url,state,labels > /tmp/intake.json

            INTAKE_TITLE=$(jq -r '.title' /tmp/intake.json)
            INTAKE_URL=$(jq -r '.url' /tmp/intake.json)
            jq -r '.body' /tmp/intake.json > /tmp/intake.md

            if [[ "$INTAKE_TITLE" != "Ham Video Teslimi - Çekim Paketi #"* ]]; then
              echo "#$INTAKE_NUMBER geçerli bir Ham Video Teslim Issue'su değil."
              exit 1
            fi

            if ! jq -e '.labels | any(.name == "ham-video-teslim")' \
              /tmp/intake.json > /dev/null; then
              echo "Teslim kaydında ham-video-teslim etiketi bulunamadı."
              exit 1
            fi

            if ! jq -e '.labels | any(.name == "kurgu-bekliyor")' \
              /tmp/intake.json > /dev/null; then
              echo "Teslim kaydı kurgu beklemiyor."
              exit 1
            fi

            PACKAGE_NUMBER=$(grep -oE 'source-package-issue: #[0-9]+' /tmp/intake.md \
              | grep -oE '[0-9]+' \
              | head -n 1 \
              || true)

            if [[ -z "$PACKAGE_NUMBER" ]]; then
              PACKAGE_NUMBER=$(grep -oE 'Çekim Paketi #[0-9]+' <<< "$INTAKE_TITLE" \
                | grep -oE '[0-9]+' \
                | head -n 1 \
                || true)
            fi

            if [[ -z "$PACKAGE_NUMBER" ]]; then
              echo "Teslim kaydının kaynak Çekim Paketi numarası çözülemedi."
              exit 1
            fi
          fi

          {
            echo "INTAKE_NUMBER=$INTAKE_NUMBER"
            echo "INTAKE_URL=$INTAKE_URL"
            echo "PACKAGE_NUMBER=$PACKAGE_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Çekim paketini ve nihai senaryoyu doğrula
        shell: bash
        run: |
          set -euo pipefail

          gh issue view "$PACKAGE_NUMBER" \
            --json title,body,url,state,labels > /tmp/package.json

          PACKAGE_TITLE=$(jq -r '.title' /tmp/package.json)
          PACKAGE_URL=$(jq -r '.url' /tmp/package.json)
          jq -r '.body' /tmp/package.json > /tmp/package-full.md

          if [[ "$PACKAGE_TITLE" != "Çekim Paketi - Nihai Senaryolar #"* ]]; then
            echo "#$PACKAGE_NUMBER geçerli bir Çekim Paketi Issue'su değil."
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "cekim-paketi")' /tmp/package.json > /dev/null \
            && ! jq -e '.labels | any(.name == "filming-package")' /tmp/package.json > /dev/null; then
            echo "Çekim paketinde cekim-paketi etiketi bulunamadı."
            exit 1
          fi

          FINAL_NUMBER=$(grep -oE 'Nihai Senaryolar #[0-9]+' <<< "$PACKAGE_TITLE" \
            | grep -oE '[0-9]+' \
            | head -n 1 \
            || true)

          if [[ -z "$FINAL_NUMBER" ]]; then
            echo "Çekim paketinin kaynak Nihai Senaryolar numarası çözülemedi."
            exit 1
          fi

          # Nihai Senaryolar Issue'sunun gövdesi hâlâ üç senaryoyu birden
          # içerir (seçim kapısı yalnız etiket değiştirir, gövdeyi
          # kısaltmaz). Çekim paketi hangi SENARYO'nun üretime seçildiğini
          # scenario=N işaretiyle taşır; bunu kaybetmeden buradan okuyup
          # kendi paketimize de aktarıyoruz.
          SELECTED_SCENARIO=$(grep -oE 'scenario=[123]\b' /tmp/package-full.md \
            | head -n 1 \
            | cut -d= -f2 \
            || true)

          if [[ ! "$SELECTED_SCENARIO" =~ ^[123]$ ]]; then
            echo "Çekim paketinde seçilen senaryo numarası (scenario=N) bulunamadı."
            exit 1
          fi

          gh issue view "$FINAL_NUMBER" \
            --json title,body,url,labels > /tmp/final.json

          FINAL_URL=$(jq -r '.url' /tmp/final.json)
          jq -r '.body' /tmp/final.json > /tmp/final-full.md

          if ! jq -e '.labels | any(.name == "eren-onayli" or .name == "owner-approved")' \
            /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryolar yetkili işletme sahibi tarafından onaylanmamış."
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "cekime-hazir")' /tmp/final.json > /dev/null \
            && ! jq -e '.labels | any(.name == "production-ready")' /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryolar çekime hazır değil."
            exit 1
          fi

          {
            echo "PACKAGE_TITLE=$PACKAGE_TITLE"
            echo "PACKAGE_URL=$PACKAGE_URL"
            echo "FINAL_NUMBER=$FINAL_NUMBER"
            echo "FINAL_URL=$FINAL_URL"
            echo "SELECTED_SCENARIO=$SELECTED_SCENARIO"
          } >> "$GITHUB_ENV"

      - name: Yalnızca kurgu için gerekli kaynakları ayıkla
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          package = Path("/tmp/package-full.md").read_text(encoding="utf-8")
          final = Path("/tmp/final-full.md").read_text(encoding="utf-8")

          package = re.sub(r"<!--.*?-->", "", package, flags=re.DOTALL)
          final = re.sub(r"<!--.*?-->", "", final, flags=re.DOTALL)

          heading_re = re.compile(r"(?m)^##\s+(.+)$")
          headings = list(heading_re.finditer(package))
          wanted = []

          for index, heading in enumerate(headings):
              title = heading.group(1).casefold()
              if any(
                  key in title
                  for key in (
                      "çekim planı",
                      "shorts",
                      "reels",
                      "çekim sıra",
                      "dosya kontrol",
                      "çekim sonu",
                  )
              ):
                  end = headings[index + 1].start() if index + 1 < len(headings) else len(package)
                  block = package[heading.start():end].strip()
                  placeholder = re.search(
                      r"yalnızca bir senaryo.*bu pakette yer almaz",
                      block,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  if not placeholder:
                      wanted.append(block)

          package_excerpt = "\n\n".join(wanted).strip()
          if not package_excerpt:
              raise SystemExit("Çekim paketinden kurgu bölümleri ayıklanamadı.")

          package_excerpt = re.sub(r"\n{3,}", "\n\n", package_excerpt).strip() + "\n"
          final = re.sub(r"\n{3,}", "\n\n", final).strip() + "\n"

          package_size = len(package_excerpt.encode("utf-8"))
          final_size = len(final.encode("utf-8"))

          if package_size < 800 or package_size > 24000:
              raise SystemExit(f"Kurgu paketi kaynak özeti güvenli sınır dışında: {package_size} bayt")
          if final_size < 1000 or final_size > 20000:
              raise SystemExit(f"Nihai senaryo güvenli sınır dışında: {final_size} bayt")

          Path("/tmp/package-excerpt.md").write_text(package_excerpt, encoding="utf-8")
          Path("/tmp/final-clean.md").write_text(final, encoding="utf-8")
          print(f"Ayıklanan kaynak: package={package_size} final={final_size} bayt")
          PY

          PACKAGE_CHARS=$(wc -c < /tmp/package-excerpt.md)
          FINAL_CHARS=$(wc -c < /tmp/final-clean.md)
          INTAKE_CHARS=$(wc -c < /tmp/intake.md)

          SOURCE_SHA=$(cat \
            /tmp/intake.md \
            /tmp/package-excerpt.md \
            /tmp/final-clean.md \
            | sha256sum \
            | awk '{print $1}')

          if [[ "$TEST_MODE" == "true" ]]; then
            EDITING_TITLE="TEST Kurgu Paketi - Çekim Paketi #$PACKAGE_NUMBER"
          else
            EDITING_TITLE="Kurgu Paketi - Ham Video Teslimi #$INTAKE_NUMBER"
          fi

          EXISTING_NUMBER=$(gh issue list \
            --state all \
            --search "\"$EDITING_TITLE\" in:title" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$EDITING_TITLE\") | .number" \
            | head -n 1)

          SKIP_EDITING=false
          if [[ -n "$EXISTING_NUMBER" ]]; then
            gh issue view "$EXISTING_NUMBER" --json body > /tmp/existing-editing.json
            EXISTING_BODY=$(jq -r '.body' /tmp/existing-editing.json)
            if grep -Fq "source-bundle-sha256: $SOURCE_SHA" <<< "$EXISTING_BODY" \
              && grep -Fq "editing-package-version: $EDITING_PACKAGE_VERSION" \
                <<< "$EXISTING_BODY"; then
              SKIP_EDITING=true
              echo "Bu kaynaklar için güncel kurgu paketi zaten mevcut: #$EXISTING_NUMBER"
            fi
          fi

          {
            echo "PACKAGE_CHARS=$PACKAGE_CHARS"
            echo "FINAL_CHARS=$FINAL_CHARS"
            echo "INTAKE_CHARS=$INTAKE_CHARS"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "EDITING_TITLE=$EDITING_TITLE"
            echo "EXISTING_NUMBER=$EXISTING_NUMBER"
            echo "SKIP_EDITING=$SKIP_EDITING"
          } >> "$GITHUB_ENV"

      - name: Token tasarruflu kurgu planı isteğini hazırla
        if: env.SKIP_EDITING != 'true' && env.TEST_MODE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          node .github/scripts/build_editing_package_prompt.mjs \
            --profile .github/config/business-profile.json \
            --system-output /tmp/system-prompt.txt \
            --metadata-output /tmp/editing-profile-metadata.json

          jq -n \
            --rawfile intake /tmp/intake.md \
            --rawfile package /tmp/package-excerpt.md \
            --rawfile final /tmp/final-clean.md \
            --arg intake_url "$INTAKE_URL" \
            --arg package_url "$PACKAGE_URL" \
            --arg final_url "$FINAL_URL" \
            --arg test_mode "$TEST_MODE" \
            -r \
            '(
              "Aşağıdaki kaynaklardan uygulanabilir kurgu paketi hazırla.\n" +
              "Test modu: " + $test_mode + "\n" +
              "Teslim kaydı: " + $intake_url + "\n" +
              "Çekim paketi: " + $package_url + "\n" +
              "Nihai senaryo: " + $final_url + "\n\n" +
              "TESLİM KAYDI\n\n" + $intake +
              "\n\nÇEKİM PAKETİNDEN GEREKLİ BÖLÜMLER\n\n" + $package +
              "\n\nONAYLI NİHAİ SENARYO\n\n" + $final
            )' > /tmp/editing-package-prompt.txt

      - name: Cost guard ön kontrolü (preflight)
        if: env.SKIP_EDITING != 'true' && env.TEST_MODE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Fail before spending any real provider tokens if the cost-guard
          # config itself is broken/unreadable.
          python3 -c "
          import json
          config = json.load(open('.github/config/cost-guard.json', encoding='utf-8'))
          limits = config['limits']
          for key in ('max_provider_attempts', 'max_input_tokens', 'max_output_tokens', 'max_total_tokens'):
              assert isinstance(limits[key], int) and limits[key] > 0, f'invalid limit: {key}'
          assert isinstance(config['monetary']['enabled'], bool)
          print('Cost guard preflight: config gecerli.')
          "

      - name: Kurgu paketi test modu fixture'ını üret ve doğrula
        if: env.SKIP_EDITING != 'true' && env.TEST_MODE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # TEST_MODE izolasyonu: bu adım hiçbir AI Router / provider
          # çağrısı yapmaz, hiçbir Cost Guard çağrısı yapmaz (gerçek
          # kullanım verisi olmadığından uydurma bir meta-dosya da
          # üretilmez), ve gerçek kaynak metnini (package-excerpt.md /
          # final-clean.md) HİÇ okumaz — tamamen sabit, deterministik bir
          # metin yazar. SKIP_EDITING bu adımı etkilemez; SKIP_EDITING
          # yalnızca "bu kaynaklar için güncel paket zaten var mı"
          # idempotency kontrolüdür, TEST_MODE ise "gerçek dış etki/provider
          # erişilebilir mi" sorusudur — ikisi kasıtlı olarak ayrı kalır.
          cat > /tmp/editing-package.md <<'FIXTURE'
          <!-- EDITING_TEST_MODE_FIXTURE_V1 -->
          ## 1. Kaynak Dosya Kontrolü
          Sabit test verisi: TEST-video.mp4, TEST-shorts.mp4. Bu bölüm dosya adlarının ve biçimlerinin listelendiğini doğrular.

          ## 2. Ana Video Kurgu Akışı
          Sabit test verisi: kanca, gelişme ve kapanış sırası örnek olarak gösterilir. Bu pakette ham video hiç görülmeden, yalnızca metinsel bir kurgu planı taslağı üretilmiştir.

          ## 3. Ekran Yazıları
          Sabit test verisi: örnek ekran yazısı zamanlamaları ve içerikleri.

          ## 4. Ses Düzenleme
          Sabit test verisi: örnek ses seviyesi ve arka plan müziği notları.

          ## 5. Kısa Video (Shorts/Reels) Kurgusu
          Sabit test verisi: örnek dikey kesit zaman kodları.

          ## 6. Dışa Aktarma Ayarları
          Sabit test verisi: örnek çözünürlük ve format notları.

          ## 7. Son Kontrol Listesi
          Sabit test verisi: örnek son kontrol maddeleri.
          FIXTURE

          if ! grep -Fq "EDITING_TEST_MODE_FIXTURE_V1" /tmp/editing-package.md; then
            echo "Test modu fixture işareti eksik — fixture bütünlüğü doğrulanamadı."
            exit 1
          fi

          # Fixture'ın gerçek editing-package çıktı sözleşmesini temsil
          # ettiğini kanıtlamak için, gerçek AI çıktısını doğrulayan AYNI
          # script burada da çalıştırılır — iki ayrı, birbirinden
          # sapabilecek kopya değil, tek bir paylaşılan sözleşme.
          bash .github/scripts/validate_editing_package_output.sh /tmp/editing-package.md

          PACKAGE_OUTPUT_CHARS=$(wc -c < /tmp/editing-package.md)

          {
            echo "EDITING_AI_PROVIDER=test-mode-fixture"
            echo "EDITING_AI_MODEL=test-mode-fixture"
            echo "EDITING_INPUT_TOKENS=0"
            echo "EDITING_OUTPUT_TOKENS=0"
            echo "EDITING_OUTPUT_CHARS=$PACKAGE_OUTPUT_CHARS"
          } >> "$GITHUB_ENV"

          {
            echo "### Kurgu ajanı test modu özeti"
            echo "- test_mode: $TEST_MODE"
            echo "- provider: test-mode-fixture (gerçek provider çağrısı yapılmadı)"
            echo "- ai_router_calls: 0"
            echo "- cost_guard_calls: 0"
            echo "- input_tokens: 0"
            echo "- output_tokens: 0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kurgu paketini oluştur ve doğrula
        if: env.SKIP_EDITING != 'true' && env.TEST_MODE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Router, provider'lardan hiçbiri kullanılamıyorsa (eksik anahtar
          # dahil) diğerini otomatik dener — bu yüzden yalnız
          # ANTHROPIC_API_KEY'in varlığını arayan eski sabit ön kontrol
          # kaldırıldı; asıl fail-closed garanti aşağıdaki
          # provider/model/çıktı kontrolüdür. Model ve token bütçesi
          # öncekiyle birebir aynı şekilde sabit kalıyor (business-profile
          # üzerinden değil, filming-package-agent-v4-router.yml'deki
          # sabit --primary-model deseniyle tutarlı).
          python3 .github/scripts/ai_router.py \
            --config .github/config/ai-router.json \
            --system-file /tmp/system-prompt.txt \
            --prompt-file /tmp/editing-package-prompt.txt \
            --output-file /tmp/editing-package.md \
            --meta-file /tmp/editing-package-meta.json \
            --max-tokens 5000 \
            --primary-model claude-sonnet-4-6

          EDITING_AI_PROVIDER=$(jq -r '.provider // ""' /tmp/editing-package-meta.json)
          EDITING_AI_MODEL=$(jq -r '.model // ""' /tmp/editing-package-meta.json)
          STOP_REASON=$(jq -r '.stop_reason // empty' /tmp/editing-package-meta.json)
          INPUT_TOKENS=$(jq -r '.total_input_tokens // .input_tokens // 0' /tmp/editing-package-meta.json)
          OUTPUT_TOKENS=$(jq -r '.total_output_tokens // .output_tokens // 0' /tmp/editing-package-meta.json)

          if [[ -z "$EDITING_AI_PROVIDER" || -z "$EDITING_AI_MODEL" || ! -s /tmp/editing-package.md ]]; then
            echo "Router geçerli provider/model/kurgu paketi üretmedi."
            exit 1
          fi

          # ai_router.py'nin usable() kabul kriteri bu iş akışının kendi
          # sıkı end_turn kontrolünden daha gevşektir; migration'ın
          # davranışı sessizce gevşetmemesi için aynı sıkı kontrol burada
          # seçilen sağlayıcının gerçek stop_reason'ı üzerinde korunur.
          if [[ "$STOP_REASON" != "end_turn" ]]; then
            echo "Kurgu paketi tamamlanmadı: provider=$EDITING_AI_PROVIDER stop_reason=$STOP_REASON"
            exit 1
          fi

          # Cost guard kullanım doğrulaması (postflight) — bu run'ın gerçek
          # kullanımı yapılandırılmış sınırı aştıysa aşağıdaki hiçbir ileri
          # adım (yapısal doğrulama, Issue yazımı) çalışmadan işi kapalı
          # (fail-closed) durdurur.
          python3 .github/scripts/cost_guard.py \
            --meta-file /tmp/editing-package-meta.json \
            --config .github/config/cost-guard.json

          # Test modu fixture'ıyla aynı paylaşılan sözleşme scriptini
          # çalıştırır — gerçek AI çıktısı ve fixture asla iki farklı
          # kopya kontrolle doğrulanmaz.
          bash .github/scripts/validate_editing_package_output.sh /tmp/editing-package.md

          PACKAGE_OUTPUT_CHARS=$(wc -c < /tmp/editing-package.md)

          {
            echo "EDITING_AI_PROVIDER=$EDITING_AI_PROVIDER"
            echo "EDITING_AI_MODEL=$EDITING_AI_MODEL"
            echo "EDITING_INPUT_TOKENS=$INPUT_TOKENS"
            echo "EDITING_OUTPUT_TOKENS=$OUTPUT_TOKENS"
            echo "EDITING_OUTPUT_CHARS=$PACKAGE_OUTPUT_CHARS"
          } >> "$GITHUB_ENV"

          {
            echo "### Kurgu ajanı AI kullanım özeti"
            echo "- test_mode: $TEST_MODE"
            echo "- provider: $EDITING_AI_PROVIDER"
            echo "- model: $EDITING_AI_MODEL"
            echo "- intake_chars: $INTAKE_CHARS"
            echo "- filming_package_chars: $PACKAGE_CHARS"
            echo "- final_script_chars: $FINAL_CHARS"
            echo "- input_tokens: $INPUT_TOKENS"
            echo "- output_tokens: $OUTPUT_TOKENS"
            echo "- web_searches: 0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kurgu paketi içeriğini hazırla
        if: env.SKIP_EDITING != 'true'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "<!-- source-bundle-sha256: $SOURCE_SHA -->"
            echo "<!-- editing-package-version: $EDITING_PACKAGE_VERSION -->"
            echo "<!-- EDITING_AI_USAGE_V1 test=$TEST_MODE provider=$EDITING_AI_PROVIDER model=$EDITING_AI_MODEL intake_chars=$INTAKE_CHARS package_chars=$PACKAGE_CHARS final_chars=$FINAL_CHARS input=$EDITING_INPUT_TOKENS output=$EDITING_OUTPUT_TOKENS web_search=0 output_chars=$EDITING_OUTPUT_CHARS -->"
            if [[ "$TEST_MODE" == "true" ]]; then
              echo "> **Durum:** 🧪 Videosuz sistem testi — gerçek teslim veya yayın kaydı değildir"
            else
              REVIEW_STATUS=$(jq -r '.review_status' /tmp/editing-profile-metadata.json)
              echo "> **Durum:** $REVIEW_STATUS"
            fi
            echo
            echo "**Kaynak teslim kaydı:** $INTAKE_URL"
            echo "**Kaynak çekim paketi:** $PACKAGE_URL"
            echo "**Kaynak onaylı senaryo:** $FINAL_URL"
            echo "**Seçilen senaryo:** $SELECTED_SCENARIO"
            echo
            cat /tmp/editing-package.md
          } > /tmp/editing-issue-body.md

      - name: Kurgu paketi etiketlerini kalıcı hale getir
        if: env.SKIP_EDITING != 'true'
        shell: bash
        env:
          EDITING_BODY_FILE: /tmp/editing-issue-body.md
        run: bash .github/scripts/persist_editing_package_labels.sh

      - name: Kurgu paketi hazırlandı yorumunu ve özetini yaz
        if: env.SKIP_EDITING != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TEST_MODE" == "false" ]]; then
            gh issue comment "$INTAKE_NUMBER" \
              --body "✂️ Kurgu paketi hazırlandı: $EDITING_URL"
          fi

          {
            echo "### Kurgu paketi hazırlandı"
            echo "- Test modu: $TEST_MODE"
            echo "- Kaynak çekim paketi: #$PACKAGE_NUMBER"
            echo "- Kaynak nihai senaryo: #$FINAL_NUMBER"
            echo "- Kurgu paketi: #$EDITING_NUMBER"
            echo "- Gerçek teslim etiketleri değiştirildi: $([[ "$TEST_MODE" == "true" ]] && echo hayır || echo evet)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Güncel kurgu paketi zaten varsa özeti yaz
        if: env.SKIP_EDITING == 'true'
        shell: bash
        run: |
          set -euo pipefail

          EDITING_URL=$(gh issue view "$EXISTING_NUMBER" --json url --jq '.url')
          echo "### Güncel kurgu paketi zaten mevcut" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test modu: $TEST_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kaynak çekim paketi: #$PACKAGE_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Paket: $EDITING_URL" >> "$GITHUB_STEP_SUMMARY"
