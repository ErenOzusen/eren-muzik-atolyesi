name: VibeFrame Compatibility Test

"on":
  push:
    paths:
      - ".github/scripts/vibeframe_project_adapter.py"
      - ".github/scripts/test_vibeframe_project_adapter.py"
      - ".github/workflows/vibeframe-compatibility-test.yml"
  workflow_dispatch:
    inputs:
      test_issue_number:
        description: "sistem-testi Nihai Senaryolar Issue numarası"
        required: true
        default: "37"
        type: string
      test_scenario:
        description: "Test senaryosu: 1, 2 veya 3"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read
  issues: read

jobs:
  vibeframe-zero-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ inputs.test_issue_number || '37' }}
      SCENARIO: ${{ inputs.test_scenario || '2' }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Adapter yerel testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/vibeframe_project_adapter.py
          python3 .github/scripts/test_vibeframe_project_adapter.py

      - name: Sistem-testi senaryosunu ayıkla
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ || ! "$SCENARIO" =~ ^[123]$ ]]; then
            echo "Geçersiz test girdisi."
            exit 1
          fi

          gh issue view "$ISSUE_NUMBER" --json title,body,labels,state,url > /tmp/issue.json
          jq -r '.labels[].name' /tmp/issue.json > /tmp/labels.txt
          if ! grep -qx 'sistem-testi' /tmp/labels.txt; then
            echo "Bu workflow yalnız sistem-testi Issue'su kullanabilir."
            exit 1
          fi
          TITLE=$(jq -r '.title // ""' /tmp/issue.json)
          if [[ "$TITLE" != Nihai\ Senaryolar* ]]; then
            echo "Kaynak Nihai Senaryolar değil."
            exit 1
          fi
          jq -r '.body // ""' /tmp/issue.json > /tmp/all-scripts.md
          export SCENARIO
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          text = Path('/tmp/all-scripts.md').read_text(encoding='utf-8')
          n = os.environ['SCENARIO']
          pattern = rf'(?ms)^##\s+SENARYO\s+{n}:.*?(?=^##\s+SENARYO\s+[123]:|^---\s*$|\Z)'
          m = re.search(pattern, text)
          if not m:
              raise SystemExit(f'SENARYO {n} bulunamadı')
          selected = m.group(0).strip() + '\n'
          Path('/tmp/selected-script.md').write_text(selected, encoding='utf-8')
          print(selected)
          PY

      - name: VibeFrame proje taslağını üret
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/vibeframe_project_adapter.py \
            --script-file /tmp/selected-script.md \
            --output-dir /tmp/vibeframe-test \
            --profile .github/config/business-profile.json \
            --duration 10 \
            --aspect 9:16
          test -s /tmp/vibeframe-test/STORYBOARD.md
          test -s /tmp/vibeframe-test/DESIGN.md
          test -s /tmp/vibeframe-test/scenes/01-approved-script.md
          cmp /tmp/selected-script.md /tmp/vibeframe-test/APPROVED_SCRIPT.md

      - name: VibeFrame CLI 0.115.2 kur
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @vibeframe/cli@0.115.2
          vibe --version

      - name: Storyboard doğrula ve sıfır harcamalı planla
        shell: bash
        run: |
          set -euo pipefail
          vibe storyboard validate /tmp/vibeframe-test --json > /tmp/vibe-validate.json
          vibe plan /tmp/vibeframe-test --json > /tmp/vibe-plan.json

          set +e
          vibe build /tmp/vibeframe-test --dry-run --max-cost 0 --json \
            > /tmp/vibe-build-stdout.json 2> /tmp/vibe-build-stderr.json
          BUILD_EXIT=$?
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          validate = json.loads(Path('/tmp/vibe-validate.json').read_text(encoding='utf-8'))
          plan = json.loads(Path('/tmp/vibe-plan.json').read_text(encoding='utf-8'))
          stdout = Path('/tmp/vibe-build-stdout.json').read_text(encoding='utf-8').strip()
          stderr = Path('/tmp/vibe-build-stderr.json').read_text(encoding='utf-8').strip()
          dry = json.loads(stdout or stderr)

          print('validate:', json.dumps(validate, ensure_ascii=False)[:1500])
          print('plan:', json.dumps(plan, ensure_ascii=False)[:2500])
          print('dry-run:', json.dumps(dry, ensure_ascii=False)[:2500])

          validation = (plan.get('data') or {}).get('validation') or plan.get('validation') or {}
          if validation and validation.get('ok') is False:
              raise SystemExit('VibeFrame storyboard validation başarısız.')

          cost = plan.get('costUsd')
          if cost is None:
              cost = (plan.get('data') or {}).get('estimatedCostUsd')
          if cost is None:
              cost = ((plan.get('data') or {}).get('plan') or {}).get('estimatedCostUsd')
          if cost is None:
              cost = plan.get('estimatedCostUsd')

          if dry.get('success') is False and dry.get('code') != 'COST_CAP_EXCEEDED':
              raise SystemExit(f"Beklenmeyen dry-run hatası: {dry.get('code')} {dry.get('error')}")

          dry_plan = ((dry.get('data') or {}).get('plan') or {})
          estimated = dry_plan.get('estimatedCostUsd', cost if cost is not None else 0)
          Path('/tmp/vibe-estimated-cost.txt').write_text(str(estimated), encoding='utf-8')
          print(f'Tahmini gelecek üretim maliyeti: ${estimated}; bu testte gerçek harcama: $0')
          PY

          ESTIMATED_COST=$(cat /tmp/vibe-estimated-cost.txt)
          echo "VIBE_ESTIMATED_COST=$ESTIMATED_COST" >> "$GITHUB_ENV"

      - name: Güvenli test özeti
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### VibeFrame uygunluk testi başarılı"
            echo "- Kaynak: sistem-testi Issue #$ISSUE_NUMBER / Senaryo $SCENARIO"
            echo "- Adapter testleri: geçti"
            echo "- VibeFrame storyboard validate: geçti"
            echo "- VibeFrame plan: geçti"
            echo "- Güvenlik kapısı: --dry-run --max-cost 0"
            echo "- Planlanan ileriki üretim tahmini: \$$VIBE_ESTIMATED_COST"
            echo "- Bu testte harici AI/video üretimi: yapılmadı"
            echo "- Bu testte AI/video API harcaması: \$0"
            echo "- Gerçek MP4 üretimi: yapılmadı"
          } >> "$GITHUB_STEP_SUMMARY"
