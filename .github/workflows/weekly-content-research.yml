name: Haftalık İçerik Araştırma Raporu

on:
  schedule:
    # Her Pazartesi Türkiye saatiyle 08:00 (UTC 05:00)
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Claude çağrısı yapmadan merkezi profil bağlantısını test et"
        required: true
        default: true
        type: boolean

jobs:
  weekly-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL }}
      QWEN_CHAT_ENDPOINT: ${{ vars.QWEN_CHAT_ENDPOINT }}
      TEST_MODE: ${{ inputs.test_mode || 'false' }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Router ve yapılandırmayı yerel doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/ai_router.py
          python3 -m json.tool .github/config/ai-router.json > /dev/null

      - name: Merkezi işletme profilini doğrula ve yükle
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/validate_business_config.py \
            --config .github/config/business-profile.json \
            --output /tmp/business-profile-validation.md \
            --test-mode true

          PROFILE_PATH=.github/config/business-profile.json
          BRAND_NAME=$(jq -r '.business.brand_name' "$PROFILE_PATH")
          OWNER_NAME=$(jq -r '.business.owner_display_name' "$PROFILE_PATH")
          BUSINESS_CATEGORY=$(jq -r '.business.category' "$PROFILE_PATH")
          BUSINESS_TIMEZONE=$(jq -r '.business.timezone' "$PROFILE_PATH")
          SERVICES_TEXT=$(jq -r '.offer.services | join(", ")' "$PROFILE_PATH")
          EQUIPMENT_TEXT=$(jq -r '.offer.available_equipment | join(", ")' "$PROFILE_PATH")
          CONTENT_TOPICS_TEXT=$(jq -r '.content.content_topics | join(", ")' "$PROFILE_PATH")
          PRIMARY_PLATFORM=$(jq -r '.content.primary_platform' "$PROFILE_PATH")
          SECONDARY_FORMATS_TEXT=$(jq -r '.content.secondary_formats | join(", ")' "$PROFILE_PATH")
          PRIMARY_CTA=$(jq -r '.offer.primary_cta' "$PROFILE_PATH")
          RESERVATION_URL=$(jq -r '.offer.reservation_url' "$PROFILE_PATH")
          DEFAULT_MODEL=$(jq -r '.cost_control.default_model' "$PROFILE_PATH")
          LOOKBACK_DAYS=$(jq -r '.content.research.lookback_days' "$PROFILE_PATH")
          RESEARCH_CHANNEL_COUNT=$(jq -r '.content.research.youtube_channels | length' "$PROFILE_PATH")
          IDEA_COUNT=$(jq -r '.content.research.idea_count' "$PROFILE_PATH")
          REPORT_MAX_WORDS=$(jq -r '.content.research.report_max_words' "$PROFILE_PATH")
          SOURCE_CHAR_LIMIT=$(jq -r '.content.research.source_char_limit' "$PROFILE_PATH")
          MAX_OUTPUT_TOKENS=$(jq -r '.content.research.max_model_output' "$PROFILE_PATH")
          PROFILE_FILE_SHA=$(sha256sum "$PROFILE_PATH" | awk '{print $1}')

          {
            echo "BRAND_NAME=$BRAND_NAME"
            echo "OWNER_NAME=$OWNER_NAME"
            echo "BUSINESS_CATEGORY=$BUSINESS_CATEGORY"
            echo "BUSINESS_TIMEZONE=$BUSINESS_TIMEZONE"
            echo "SERVICES_TEXT=$SERVICES_TEXT"
            echo "EQUIPMENT_TEXT=$EQUIPMENT_TEXT"
            echo "CONTENT_TOPICS_TEXT=$CONTENT_TOPICS_TEXT"
            echo "PRIMARY_PLATFORM=$PRIMARY_PLATFORM"
            echo "SECONDARY_FORMATS_TEXT=$SECONDARY_FORMATS_TEXT"
            echo "PRIMARY_CTA=$PRIMARY_CTA"
            echo "RESERVATION_URL=$RESERVATION_URL"
            echo "DEFAULT_MODEL=$DEFAULT_MODEL"
            echo "LOOKBACK_DAYS=$LOOKBACK_DAYS"
            echo "RESEARCH_CHANNEL_COUNT=$RESEARCH_CHANNEL_COUNT"
            echo "IDEA_COUNT=$IDEA_COUNT"
            echo "REPORT_MAX_WORDS=$REPORT_MAX_WORDS"
            echo "SOURCE_CHAR_LIMIT=$SOURCE_CHAR_LIMIT"
            echo "MAX_OUTPUT_TOKENS=$MAX_OUTPUT_TOKENS"
            echo "PROFILE_FILE_SHA=$PROFILE_FILE_SHA"
          } >> "$GITHUB_ENV"

      - name: Merkezi profil bağlantısını sıfır-token ile test et
        if: ${{ env.TEST_MODE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT_TITLE="TEST Merkezi Profil Bağlantısı - Haftalık Araştırma Ajanı"
          {
            echo "<!-- PROFILE_BINDING_USAGE_V1 agent=weekly-research test=true input=0 output=0 web_search=0 profile_sha=$PROFILE_FILE_SHA -->"
            echo "> **Durum:** ✅ Haftalık Araştırma Ajanı merkezi işletme profiline güvenle bağlandı."
            echo
            echo "# 🔗 MERKEZİ PROFİL BAĞLANTI TESTİ"
            echo
            echo "- **Marka:** $BRAND_NAME"
            echo "- **İşletme sahibi:** $OWNER_NAME"
            echo "- **Faaliyet alanı:** $BUSINESS_CATEGORY"
            echo "- **Hizmetler:** $SERVICES_TEXT"
            echo "- **Mevcut ekipman:** $EQUIPMENT_TEXT"
            echo "- **İçerik konuları:** $CONTENT_TOPICS_TEXT"
            echo "- **Birincil platform:** $PRIMARY_PLATFORM"
            echo "- **İkincil biçimler:** $SECONDARY_FORMATS_TEXT"
            echo "- **Araştırma dönemi:** Son $LOOKBACK_DAYS gün"
            echo "- **Rakip YouTube akışı:** $RESEARCH_CHANNEL_COUNT kanal"
            echo "- **Üretilecek fikir:** $IDEA_COUNT"
            echo "- **Rapor sınırı:** $REPORT_MAX_WORDS kelime"
            echo "- **Kaynak veri sınırı:** $SOURCE_CHAR_LIMIT karakter"
            echo "- **Çıktı token bütçesi:** $MAX_OUTPUT_TOKENS"
            echo "- **Model:** $DEFAULT_MODEL"
            echo "- **Saat dilimi:** $BUSINESS_TIMEZONE"
            echo "- **Ana çağrı:** $PRIMARY_CTA"
            echo "- **Rezervasyon:** $RESERVATION_URL"
            echo "- **AI kullanımı:** 0 giriş tokenı, 0 çıkış tokenı"
            echo "- **Web araması:** 0"
            echo "- **Gerçek haftalık rapor:** Oluşturulmadı"
            echo
            echo "> Bu test yalnızca profil bağlantısını doğrular; kaynak toplamaz, Claude çağırmaz ve üretim Issue'su oluşturmaz."
          } > /tmp/profile-binding-test.md

          gh label create "profil-baglantisi" \
            --color "0E8A16" \
            --description "Ajanın merkezi işletme profili bağlantısı" \
            --force
          gh label create "sistem-testi" \
            --color "BFD4F2" \
            --description "Gerçek üretim kayıtlarını değiştirmeyen sistem testi" \
            --force

          EXISTING_NUMBER=$(gh issue list \
            --state all \
            --search "\"$REPORT_TITLE\" in:title" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$REPORT_TITLE\") | .number" \
            | head -n 1)

          if [[ -n "$EXISTING_NUMBER" ]]; then
            gh issue edit "$EXISTING_NUMBER" \
              --body-file /tmp/profile-binding-test.md \
              --add-label "profil-baglantisi" \
              --add-label "sistem-testi"
            REPORT_NUMBER="$EXISTING_NUMBER"
          else
            REPORT_URL=$(gh issue create \
              --title "$REPORT_TITLE" \
              --body-file /tmp/profile-binding-test.md \
              --label "profil-baglantisi" \
              --label "sistem-testi")
            REPORT_NUMBER=$(grep -oE '[0-9]+$' <<< "$REPORT_URL")
          fi

          {
            echo "### Merkezi profil bağlantısı doğrulandı"
            echo "- Ajan: Haftalık Araştırma Ajanı"
            echo "- Marka: $BRAND_NAME"
            echo "- Test raporu: #$REPORT_NUMBER"
            echo "- AI tokenı: 0"
            echo "- Üretim raporu: oluşturulmadı"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Güncel kaynakları kodla topla
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/source-data.txt
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import json
          import sys
          import xml.etree.ElementTree as ET

          profile = json.loads(
              Path(".github/config/business-profile.json").read_text(encoding="utf-8")
          )
          business = profile["business"]
          content = profile["content"]
          research = content["research"]
          lookback_days = research["lookback_days"]
          CUTOFF = datetime.now(timezone.utc) - timedelta(days=lookback_days)
          USER_AGENT = f"Mozilla/5.0 (compatible; {business['github_owner']}Research/3.0)"
          youtube_success = 0
          news_success = 0
          sources = {}
          ids_by_url = {}

          def fetch(url):
              request = Request(url, headers={"User-Agent": USER_AGENT})
              with urlopen(request, timeout=20) as response:
                  return response.read()

          def clean(text):
              return " ".join((text or "").split())

          def parse_date(text):
              if not text:
                  return None
              try:
                  return datetime.fromisoformat(text.replace("Z", "+00:00"))
              except ValueError:
                  try:
                      return parsedate_to_datetime(text).astimezone(timezone.utc)
                  except (TypeError, ValueError):
                      return None

          def source_ref(url):
              if url not in ids_by_url:
                  source_id = f"S{len(sources) + 1:02d}"
                  ids_by_url[url] = source_id
                  sources[source_id] = url
              return f"[{ids_by_url[url]}]"

          def print_youtube(name, url):
              global youtube_success
              print(f"\n### {name}")
              try:
                  root = ET.fromstring(fetch(url))
                  youtube_success += 1
                  namespace = {"atom": "http://www.w3.org/2005/Atom"}
                  recent = []
                  for entry in root.findall("atom:entry", namespace):
                      title = clean(entry.findtext("atom:title", default="", namespaces=namespace))
                      published_text = entry.findtext("atom:published", default="", namespaces=namespace)
                      published = parse_date(published_text)
                      link_element = entry.find("atom:link[@rel='alternate']", namespace)
                      link = link_element.get("href", "") if link_element is not None else ""
                      if published and published >= CUTOFF and title and link:
                          recent.append((published, title, link))
                  recent.sort(reverse=True)
                  if not recent:
                      print(f"- Son {lookback_days} günde RSS akışında yeni video bulunamadı.")
                  for published, title, link in recent[:3]:
                      print(f"- {published.date().isoformat()} | {title} | {source_ref(link)}")
              except Exception as error:
                  print(f"- Kaynak alınamadı: {type(error).__name__}")

          def print_rss(name, url, limit):
              global news_success
              print(f"\n### {name}")
              try:
                  root = ET.fromstring(fetch(url))
                  news_success += 1
                  items = []
                  for item in root.findall("./channel/item"):
                      title = clean(item.findtext("title"))
                      link = clean(item.findtext("link"))
                      published = parse_date(item.findtext("pubDate"))
                      if title and link and (published is None or published >= CUTOFF):
                          items.append((published, title, link))
                  items.sort(
                      key=lambda row: row[0] or datetime.min.replace(tzinfo=timezone.utc),
                      reverse=True,
                  )
                  if not items:
                      print(f"- Son {lookback_days} günde uygun kayıt bulunamadı.")
                  for published, title, link in items[:limit]:
                      date_text = published.date().isoformat() if published else "tarih-yok"
                      print(f"- {date_text} | {title} | {source_ref(link)}")
              except Exception as error:
                  print(f"- Kaynak alınamadı: {type(error).__name__}")

          print("# KODLA TOPLANAN GÜNCEL KAYNAKLAR")
          print(f"Toplama zamanı (UTC): {datetime.now(timezone.utc).isoformat(timespec='seconds')}")
          print(f"Kapsam başlangıcı (UTC): {CUTOFF.date().isoformat()}")

          print("\n## RAKİP YOUTUBE AKIŞLARI")
          for channel in research["youtube_channels"]:
              print_youtube(channel["name"], channel["feed_url"])

          country = research["news_country"]
          language = research["news_language"]
          print(f"\n## {country} GÜNDEM VE SEKTÖR HABERLERİ")
          print_rss(
              f"Google Trends {country}",
              research["trend_feed_url"],
              10,
          )
          query_terms = content["content_topics"] + research["news_extra_terms"]
          query_parts = [f'"{term}"' if " " in term else term for term in query_terms]
          query = quote(" OR ".join(query_parts) + f" when:{lookback_days}d")
          print_rss(
              f"Google Haberler - {business['category']}",
              f"https://news.google.com/rss/search?q={query}&hl={language}&gl={country}&ceid={country}:{language}",
              10,
          )

          if (
              youtube_success < research["minimum_youtube_feeds"]
              or news_success < research["minimum_news_feeds"]
          ):
              print(
                  f"Yetersiz kaynak: youtube={youtube_success}, haber={news_success}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          with open("/tmp/source-map.json", "w", encoding="utf-8") as handle:
              json.dump(sources, handle, ensure_ascii=False, indent=2)
          PY

          SOURCE_SIZE=$(wc -c < /tmp/source-data.txt)
          SOURCE_COUNT=$(jq 'length' /tmp/source-map.json)
          if [ "$SOURCE_SIZE" -gt "$SOURCE_CHAR_LIMIT" ]; then
            head -c "$SOURCE_CHAR_LIMIT" /tmp/source-data.txt > /tmp/source-data-limited.txt
            mv /tmp/source-data-limited.txt /tmp/source-data.txt
            SOURCE_SIZE="$SOURCE_CHAR_LIMIT"
          fi
          echo "Claude'a gönderilecek temiz veri: $SOURCE_SIZE karakter, $SOURCE_COUNT kaynak"

      - name: Cost guard ön kontrolü (preflight)
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # Fail before spending any real provider tokens if the cost-guard
          # config itself is broken/unreadable.
          python3 -c "
          import json
          config = json.load(open('.github/config/cost-guard.json', encoding='utf-8'))
          limits = config['limits']
          for key in ('max_provider_attempts', 'max_input_tokens', 'max_output_tokens', 'max_total_tokens'):
              assert isinstance(limits[key], int) and limits[key] > 0, f'invalid limit: {key}'
          assert isinstance(config['monetary']['enabled'], bool)
          print('Cost guard preflight: config gecerli.')
          "

      - name: Kısa kaynak kodlarıyla tek Claude çağrısı yap
        if: ${{ env.TEST_MODE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          DATE_TR=$(TZ="$BUSINESS_TIMEZONE" date '+%d-%m-%Y')
          SOURCES=$(< /tmp/source-data.txt)
          SOURCE_SIZE=$(wc -c < /tmp/source-data.txt)
          SOURCE_COUNT=$(jq 'length' /tmp/source-map.json)

          PROMPT=$(cat <<EOF
          $BRAND_NAME için aşağıdaki kodla toplanmış güncel verilerden haftalık
          içerik raporu hazırla. Web araması yapma; yalnızca verilen kayıtlara dayan.

          Merkezi işletme profili:
          - İşletme sahibi: $OWNER_NAME
          - Faaliyet alanı: $BUSINESS_CATEGORY
          - Hizmetler: $SERVICES_TEXT
          - Mevcut ekipman: $EQUIPMENT_TEXT
          - İçerik konuları: $CONTENT_TOPICS_TEXT
          - Birincil platform: $PRIMARY_PLATFORM
          - İkincil biçimler: $SECONDARY_FORMATS_TEXT
          - Ana çağrı: $PRIMARY_CTA
          - Rezervasyon: $RESERVATION_URL

          Yalnız bu profile uygun fikirler üret. Mevcut olmayan hizmet veya ekipman önerme.

          Kaynaklar gerçek URL yerine [S01], [S02] biçiminde kısa kimliklerle gösterilir.
          İlgili iddianın sonunda yalnız verilen kaynak kimliğini aynen kullan. URL yazma,
          kaynak kimliği uydurma veya kimliğin biçimini değiştirme.

          Doğruluk ve seçim kuralları:
          - Kaydı olmayan rakip için açıkça "son $LOOKBACK_DAYS günde kayıt bulunamadı" yaz.
          - İzlenme verisi yoksa bir videonun iyi performans gösterdiğini iddia etme.
          - Genel gündemdeki $BUSINESS_CATEGORY alanıyla ilgisiz başlıkları kullanma.
          - Ürün, hizmet, fiyat, sayı, arama hacmi veya yayın tarihi uydurma.
          - Tam $IDEA_COUNT somut fikir üret; en güçlü 3 fikri ilk sıraya koy.
          - Her fikri en az bir gerçek kaynak kimliğiyle destekle.
          - Türkçe, kısa ve aksiyon alınabilir yaz; tekrar yapma.
          - Rapor $REPORT_MAX_WORDS kelimeyi geçmesin; giriş, sonuç tekrarı ve ayraç çizgileri ekleme.
          - Trendleri en fazla 5 tek cümlelik maddeyle özetle; her madde en fazla 25 kelime olsun.
          - Her rakibi tek cümlede özetle; her cümle en fazla 25 kelime olsun.

          Zorunlu çıktı biçimi:
          # Haftalık İçerik Araştırma Raporu - $DATE_TR
          ## 1. TREND KONULAR
          ## 2. RAKİP HAREKETLERİ
          ## 3. İÇERİK FİKİRLERİ
          ### 💡 Fikir 1 (En Güçlü)
          ### 💡 Fikir 2 (En Güçlü)
          ### 💡 Fikir 3 (En Güçlü)
          ### 💡 Fikir 4
          ### 💡 Fikir 5

          Her fikirde yalnız şunlar olsun; her alan tek cümle olsun:
          - Başlık
          - İlgili hizmet/konu
          - Format
          - Neden şimdi?
          - Dayandığı bulgu ve kaynak kimliği

          ## 4. BU HAFTANIN KISA KARARI

          KODLA TOPLANAN VERİLER:
          $SOURCES
          EOF
          )

          printf '%s' "$PROMPT" > /tmp/weekly-research-prompt.txt

          # No separate system prompt in the original direct call (a single
          # user-role message) — --system-file stays omitted so ai_router.py
          # preserves that exact system/user separation (none) instead of
          # inventing one.
          python3 .github/scripts/ai_router.py \
            --config .github/config/ai-router.json \
            --prompt-file /tmp/weekly-research-prompt.txt \
            --output-file /tmp/weekly-report-raw.md \
            --meta-file /tmp/weekly-research-meta.json \
            --max-tokens "$MAX_OUTPUT_TOKENS" \
            --primary-model "$DEFAULT_MODEL"

          PROVIDER=$(jq -r '.provider // ""' /tmp/weekly-research-meta.json)
          MODEL=$(jq -r '.model // ""' /tmp/weekly-research-meta.json)
          STOP_REASON=$(jq -r '.stop_reason // empty' /tmp/weekly-research-meta.json)
          INPUT_TOKENS=$(jq -r '.total_input_tokens // .input_tokens // 0' /tmp/weekly-research-meta.json)
          OUTPUT_TOKENS=$(jq -r '.total_output_tokens // .output_tokens // 0' /tmp/weekly-research-meta.json)

          echo "AI kullanım özeti: provider=$PROVIDER model=$MODEL source_chars=$SOURCE_SIZE source_count=$SOURCE_COUNT input=$INPUT_TOKENS output=$OUTPUT_TOKENS web_search=0"

          if [ -z "$PROVIDER" ] || [ -z "$MODEL" ] || [ ! -s /tmp/weekly-report-raw.md ]; then
            echo "Router geçerli provider/model/rapor üretmedi."
            exit 1
          fi

          # ai_router.py'nin usable() kabul kriteri, bu iş akışının kendi
          # mevcut sıkı end_turn kontrolünden daha gevşektir (yalnız
          # max_tokens/length/content_filter/insufficient_system_resource'u
          # reddeder). Router migration'ının davranışı sessizce
          # gevşetmemesi için aynı sıkı kontrol burada, seçilen sağlayıcının
          # gerçek stop_reason'ı üzerinde ayrıca korunur.
          if [ "$STOP_REASON" != "end_turn" ]; then
            echo "AI raporu tamamlamadı: provider=$PROVIDER stop_reason=$STOP_REASON"
            exit 1
          fi

          # Cost guard kullanım doğrulaması (postflight) — bu çağrıda
          # harcanan tokenı geri alamaz, ama bu run'ın gerçek kullanımı
          # yapılandırılmış sınırı aştıysa aşağıdaki hiçbir ileri adım
          # (yapısal doğrulama, Issue yazımı) çalışmadan işi kapalı
          # (fail-closed) durdurur.
          python3 .github/scripts/cost_guard.py \
            --meta-file /tmp/weekly-research-meta.json \
            --config .github/config/cost-guard.json

          python3 - <<'PY'
          import json
          import re

          with open("/tmp/weekly-report-raw.md", encoding="utf-8") as handle:
              report = handle.read()
          with open("/tmp/source-map.json", encoding="utf-8") as handle:
              sources = json.load(handle)

          required_sections = [
              "## 1. TREND KONULAR",
              "## 2. RAKİP HAREKETLERİ",
              "## 3. İÇERİK FİKİRLERİ",
              "## 4. BU HAFTANIN KISA KARARI",
          ]
          missing = [section for section in required_sections if section not in report]
          if missing:
              raise SystemExit(f"Eksik rapor bölümleri: {missing}")

          idea_matches = list(re.finditer(r"^### 💡 Fikir ([1-5])(?:\s|$)", report, re.MULTILINE))
          if [match.group(1) for match in idea_matches] != ["1", "2", "3", "4", "5"]:
              raise SystemExit("Rapor tam ve sıralı 5 fikir içermiyor.")

          known_ids = set(sources)
          used_ids = set(re.findall(r"\[(S\d{2})\]", report))
          unknown_ids = used_ids - known_ids
          if unknown_ids:
              raise SystemExit(f"Bilinmeyen kaynak kimlikleri: {sorted(unknown_ids)}")
          if "http://" in report or "https://" in report:
              raise SystemExit("Claude ham URL üretti; rapor yayımlanmadı.")

          for index, match in enumerate(idea_matches):
              end = idea_matches[index + 1].start() if index + 1 < len(idea_matches) else report.find("## 4.", match.start())
              block = report[match.start():end]
              if not re.search(r"\[S\d{2}\]", block):
                  raise SystemExit(f"Fikir {index + 1} kaynak kimliği içermiyor.")

          def restore_link(match):
              source_id = match.group(1)
              return f"[Kaynak {source_id}]({sources[source_id]})"

          restored = re.sub(r"\[(S\d{2})\]", restore_link, report)
          with open("/tmp/weekly-report.md", "w", encoding="utf-8") as handle:
              handle.write(restored.rstrip() + "\n")
          PY

          {
            echo "<!-- AGENT_USAGE_V1 agent=weekly-research provider=$PROVIDER model=$MODEL input=$INPUT_TOKENS output=$OUTPUT_TOKENS web_search=0 source_chars=$SOURCE_SIZE source_count=$SOURCE_COUNT profile_sha=$PROFILE_FILE_SHA -->"
            cat /tmp/weekly-report.md
          } > /tmp/weekly-report-issue.md

          gh issue create \
            --title "Haftalık İçerik Raporu - $DATE_TR" \
            --body-file /tmp/weekly-report-issue.md

          echo "Haftalık içerik raporu başarıyla oluşturuldu."
