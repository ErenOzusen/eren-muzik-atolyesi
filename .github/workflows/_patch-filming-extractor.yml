name: TEMP Patch Filming Extractor

"on":
  push:
    branches:
      - fix/filming-scenario-extractor
    paths:
      - .github/workflows/_patch-filming-extractor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/filming-scenario-extractor
          fetch-depth: 0
      - name: Build verified patched copy
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_filming_workflow.py
          python3 -m py_compile .github/scripts/extract_filming_scenario.py
          python3 .github/scripts/test_extract_filming_scenario.py
          git diff --check
          cp .github/workflows/filming-package-agent-v4-router.yml .github/scripts/filming-package-agent-v4-router.patched.yml
          git checkout -- .github/workflows/filming-package-agent-v4-router.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/filming-package-agent-v4-router.patched.yml
          git commit -m 'chore: stage verified filming workflow patch'
          git push origin HEAD:fix/filming-scenario-extractor
