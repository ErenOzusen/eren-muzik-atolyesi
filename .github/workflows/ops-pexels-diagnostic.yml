name: Ops Pexels Diagnostic

"on":
  push:
    branches:
      - "ops/faceless-issue-100-one-shot-20260923"
    paths:
      - ".github/workflows/ops-pexels-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Pexels API erişimini secret sızdırmadan ölç
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PEXELS_API_KEY" ]]
          probe() {
            local label="$1"
            local url="$2"
            local code
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 \
              --header "Authorization: $PEXELS_API_KEY" "$url" || true)"
            echo "$label=$code"
          }
          probe "photo_search" "https://api.pexels.com/v1/search?query=guitar&per_page=1"
          probe "video_search" "https://api.pexels.com/v1/videos/search?query=guitar&per_page=1"
          for id in 7574545 6670728 7508179 8472212 4706206 8103317; do
            probe "video_$id" "https://api.pexels.com/v1/videos/videos/$id"
          done
