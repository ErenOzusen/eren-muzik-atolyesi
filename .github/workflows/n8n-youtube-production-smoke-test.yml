name: n8n YouTube Production Handoff Smoke Test

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-youtube-production-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WEBHOOK_URL: ${{ secrets.YOUTUBE_PRODUCTION_WEBHOOK_URL }}
      WEBHOOK_KEY: ${{ secrets.YOUTUBE_PRODUCTION_WEBHOOK_KEY }}

    steps:
      - name: Gerekli secret'ları doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "YOUTUBE_PRODUCTION_WEBHOOK_URL secret'i eksik."
            exit 1
          fi

          if [[ -z "$WEBHOOK_KEY" ]]; then
            echo "YOUTUBE_PRODUCTION_WEBHOOK_KEY secret'i eksik."
            exit 1
          fi

          case "$WEBHOOK_URL" in
            https://*/webhook/youtube-production-ingest) ;;
            *)
              echo "Webhook URL beklenen production path ile eşleşmiyor."
              exit 1
              ;;
          esac

      - name: Güvenli smoke-test payload'u oluştur
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg event "youtube_production_smoke_test" \
            --argjson schema_version 1 \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sent_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              event: $event,
              schema_version: $schema_version,
              repository: $repository,
              actor: $actor,
              run_id: $run_id,
              run_attempt: $run_attempt,
              sent_at: $sent_at,
              test_mode: true,
              production_side_effects_allowed: false
            }' > /tmp/payload.json

          jq . /tmp/payload.json

      - name: n8n production webhook'una gönder
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE_FILE=/tmp/n8n-response.txt
          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-all-errors \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "X-YouTube-Production-Key: $WEBHOOK_KEY" \
              --data-binary @/tmp/payload.json \
              "$WEBHOOK_URL"
          )

          echo "n8n HTTP status: $HTTP_CODE"

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "n8n webhook smoke test başarısız oldu."
            cat "$RESPONSE_FILE" || true
            exit 1
          fi

          echo "n8n webhook smoke test başarılı."
          cat "$RESPONSE_FILE" || true

          {
            echo "### n8n YouTube Production webhook smoke test"
            echo "- HTTP status: $HTTP_CODE"
            echo "- test_mode: true"
            echo "- production_side_effects_allowed: false"
            echo "- AI tokenı: 0"
            echo "- YouTube API çağrısı: 0"
            echo "- Video üretimi/yükleme/yayın: 0"
          } >> "$GITHUB_STEP_SUMMARY"
