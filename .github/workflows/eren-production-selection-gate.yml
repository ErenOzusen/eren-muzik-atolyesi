name: Eren Üretim Senaryosu Seçim Kapısı

"on":
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

concurrency:
  group: eren-production-selection-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  select-scenario:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, 'Nihai Senaryolar') &&
      (github.event.comment.body == 'SEÇ 1' ||
       github.event.comment.body == 'SEÇ 2' ||
       github.event.comment.body == 'SEÇ 3' ||
       github.event.comment.body == 'TEST SEÇ 1' ||
       github.event.comment.body == 'TEST SEÇ 2' ||
       github.event.comment.body == 'TEST SEÇ 3')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Seçim komutunu güvenli biçimde doğrula
        shell: bash
        run: |
          set -euo pipefail

          PROFILE=.github/config/business-profile.json
          EXPECTED_OWNER=$(jq -r '.business.github_owner' "$PROFILE")
          COMMENT_AUTHOR=$(jq -r '.comment.user.login // ""' "$GITHUB_EVENT_PATH")
          RAW_COMMENT=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
          NORMALIZED=$(printf '%s' "$RAW_COMMENT" | tr '[:lower:]' '[:upper:]' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/[[:space:]]+/ /g')

          TEST_MODE=false
          SELECTED=""
          if [[ "$NORMALIZED" =~ ^SEÇ[[:space:]]+([123])$ ]]; then
            SELECTED="${BASH_REMATCH[1]}"
          elif [[ "$NORMALIZED" =~ ^TEST[[:space:]]+SEÇ[[:space:]]+([123])$ ]]; then
            TEST_MODE=true
            SELECTED="${BASH_REMATCH[1]}"
          else
            echo "Yorum seçim komutu değil; işlem yapılmadı."
            exit 0
          fi

          if [[ "$COMMENT_AUTHOR" != "$EXPECTED_OWNER" ]]; then
            echo "Seçim yalnız yetkili işletme sahibi tarafından yapılabilir: $COMMENT_AUTHOR"
            exit 1
          fi

          gh issue view "$ISSUE_NUMBER" --json title,body,labels,url > /tmp/issue.json
          ISSUE_TITLE=$(jq -r '.title' /tmp/issue.json)
          ISSUE_URL=$(jq -r '.url' /tmp/issue.json)
          jq -r '.body // ""' /tmp/issue.json > /tmp/body.md
          jq -r '.labels[].name' /tmp/issue.json > /tmp/labels.txt

          if [[ "$ISSUE_TITLE" != Nihai\ Senaryolar* ]]; then
            echo "Hedef Issue Nihai Senaryolar değil."
            exit 1
          fi

          if ! grep -qxE 'eren-onayli|owner-approved' /tmp/labels.txt || { ! grep -qx 'cekime-hazir' /tmp/labels.txt && ! grep -qx 'production-ready' /tmp/labels.txt; }; then
            if [[ "$TEST_MODE" != "true" ]] || ! grep -qx 'sistem-testi' /tmp/labels.txt; then
              echo "Senaryo seçimi için önce Eren onayı ve cekime-hazir durumu gerekli."
              exit 1
            fi
          fi

          if grep -qx 'duzeltme-gerekiyor' /tmp/labels.txt; then
            echo "Düzeltme gereken içerik üretime seçilemez."
            exit 1
          fi

          if ! grep -Eiq "^##[[:space:]]+SENARYO[[:space:]]+$SELECTED([^0-9]|$)" /tmp/body.md; then
            echo "Seçilen SENARYO $SELECTED nihai Issue içinde bulunamadı."
            exit 1
          fi

          if [[ "$TEST_MODE" == "true" ]]; then
            {
              echo "### Eren üretim seçimi — sıfır-token test başarılı"
              echo "- Issue: $ISSUE_URL"
              echo "- Yetkili kullanıcı: $COMMENT_AUTHOR"
              echo "- Seçilen senaryo: $SELECTED"
              echo "- Handoff kimliği: issue=$ISSUE_NUMBER scenario=$SELECTED"
              echo "- AI kullanımı: 0 giriş / 0 çıkış tokenı"
              echo "- Etiket/Issue değişikliği: yapılmadı"
              echo "- Sonraki ajan: otomatik başlatılmadı"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -qx 'sistem-testi' /tmp/labels.txt; then
            echo "Sistem testi üretim seçimiyle işaretlenemez. TEST SEÇ N kullan."
            exit 1
          fi

          for N in 1 2 3; do
            LEGACY_LABEL="uretim-senaryo-$N"
            GENERIC_LABEL="production-scenario-$N"
            gh label create "$LEGACY_LABEL" \
              --color "C5DEF5" \
              --description "Üretime seçilen nihai senaryo $N" \
              --force
            gh label create "$GENERIC_LABEL" \
              --color "C5DEF5" \
              --description "Selected production scenario $N" \
              --force

            REMOVE_ARGS=()
            if grep -qx "$LEGACY_LABEL" /tmp/labels.txt; then
              REMOVE_ARGS+=(--remove-label "$LEGACY_LABEL")
            fi
            if grep -qx "$GENERIC_LABEL" /tmp/labels.txt; then
              REMOVE_ARGS+=(--remove-label "$GENERIC_LABEL")
            fi
            if [[ "${#REMOVE_ARGS[@]}" -gt 0 ]]; then
              gh issue edit "$ISSUE_NUMBER" "${REMOVE_ARGS[@]}" > /dev/null
            fi
          done

          gh label create "uretime-secildi" \
            --color "0052CC" \
            --description "Çekim için bir nihai senaryo açıkça seçildi" \
            --force

          gh label create "production-selected" \
            --color "0052CC" \
            --description "A final scenario has been selected for production" \
            --force

          gh issue edit "$ISSUE_NUMBER" \
            --add-label "uretime-secildi" \
            --add-label "production-selected" \
            --add-label "uretim-senaryo-$SELECTED" \
            --add-label "production-scenario-$SELECTED" > /dev/null

          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' \
            > /tmp/labels-after-selection.txt

          for REQUIRED_PRESENT in \
            uretime-secildi \
            production-selected \
            "uretim-senaryo-$SELECTED" \
            "production-scenario-$SELECTED"; do
            if ! grep -qx "$REQUIRED_PRESENT" /tmp/labels-after-selection.txt; then
              echo "Üretim seçimi son durumu doğrulanamadı; zorunlu etiket eksik: $REQUIRED_PRESENT"
              exit 1
            fi
          done

          for N in 1 2 3; do
            if [[ "$N" != "$SELECTED" ]]; then
              for REQUIRED_ABSENT in "uretim-senaryo-$N" "production-scenario-$N"; do
                if grep -qx "$REQUIRED_ABSENT" /tmp/labels-after-selection.txt; then
                  echo "Üretim seçimi belirsiz kaldı; eski senaryo etiketi mevcut: $REQUIRED_ABSENT"
                  exit 1
                fi
              done
            fi
          done

          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<MESSAGE
          <!-- FILMING_HANDOFF_V1 issue=$ISSUE_NUMBER scenario=$SELECTED -->
          ## 🎯 Üretim senaryosu seçildi

          **Kaynak Issue:** #$ISSUE_NUMBER  
          **Seçilen:** SENARYO $SELECTED  
          **Durum:** Çekim Paketi Ajanı bu senaryoyu kullanabilir.  
          **Güvenli devralma:** Çekim Paketi Ajanı yalnız bu Issue numarası ve tek `uretim-senaryo-$SELECTED` etiketi eşleşirse gerçek üretime geçebilir.  
          **Güvenlik:** Sonraki ajan otomatik başlatılmadı.
          MESSAGE
          )"

          {
            echo "### Eren üretim seçimi kaydedildi"
            echo "- Issue: $ISSUE_URL"
            echo "- Handoff Issue numarası: $ISSUE_NUMBER"
            echo "- Seçilen senaryo: $SELECTED"
            echo "- AI kullanımı: 0 giriş / 0 çıkış tokenı"
            echo "- Sonraki ajan: otomatik başlatılmadı"
          } >> "$GITHUB_STEP_SUMMARY"
