name: Altyazı Hazırlık Ajanı

"on":
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Videosuz güvenli test modu"
        required: true
        default: true
        type: boolean
      editing_package_issue:
        description: "Kurgu Paketi Issue numarası (test örneği: 24)"
        required: true
        default: "24"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: subtitle-package-agent
  cancel-in-progress: false

jobs:
  create-subtitle-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      RUN_ACTOR: ${{ github.actor }}
      TEST_MODE: ${{ inputs.test_mode }}
      EDITING_NUMBER: ${{ inputs.editing_package_issue }}
      SUBTITLE_PACKAGE_VERSION: "1"

    steps:
      - name: Çalıştıranı ve girdileri doğrula
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUN_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo "Bu ajanı yalnızca repo sahibi Eren çalıştırabilir."
            exit 1
          fi

          if [[ "$TEST_MODE" != "true" && "$TEST_MODE" != "false" ]]; then
            echo "test_mode yalnızca true veya false olabilir."
            exit 1
          fi

          if [[ ! "$EDITING_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Geçerli bir Kurgu Paketi Issue numarası gerekli."
            exit 1
          fi

      - name: Kaynak kurgu paketini ve senaryoyu doğrula
        shell: bash
        run: |
          set -euo pipefail

          gh issue view "$EDITING_NUMBER" \
            --json title,body,url,state,labels > /tmp/editing.json

          EDITING_TITLE=$(jq -r '.title' /tmp/editing.json)
          EDITING_URL=$(jq -r '.url' /tmp/editing.json)
          jq -r '.body' /tmp/editing.json > /tmp/editing.md

          if ! jq -e '.labels | any(.name == "kurgu-paketi")' \
            /tmp/editing.json > /dev/null; then
            echo "Kaynak Issue bir Kurgu Paketi değil."
            exit 1
          fi

          if [[ "$TEST_MODE" == "true" ]]; then
            if ! jq -e '.labels | any(.name == "sistem-testi")' \
              /tmp/editing.json > /dev/null; then
              echo "Test modu yalnızca sistem-testi etiketli paketle çalışır."
              exit 1
            fi
            if [[ "$EDITING_TITLE" != "TEST Kurgu Paketi - Çekim Paketi #"* ]]; then
              echo "Test modu için geçerli TEST Kurgu Paketi başlığı gerekli."
              exit 1
            fi
          else
            if jq -e '.labels | any(.name == "sistem-testi")' \
              /tmp/editing.json > /dev/null; then
              echo "Gerçek mod sistem testi paketiyle çalışamaz."
              exit 1
            fi
            if ! jq -e '.labels | any(.name == "kurgu-plani-hazir")' \
              /tmp/editing.json > /dev/null; then
              echo "Gerçek kurgu paketinde kurgu-plani-hazir etiketi eksik."
              exit 1
            fi
          fi

          FINAL_NUMBER=$(sed -nE \
            's#^\*\*Kaynak onaylı senaryo:\*\* .*?/issues/([0-9]+).*$#\1#p' \
            /tmp/editing.md \
            | head -n 1)

          if [[ -z "$FINAL_NUMBER" ]]; then
            echo "Kurgu paketinin kaynak Nihai Senaryo numarası çözülemedi."
            exit 1
          fi

          gh issue view "$FINAL_NUMBER" \
            --json title,body,url,labels > /tmp/final.json

          FINAL_URL=$(jq -r '.url' /tmp/final.json)
          jq -r '.body' /tmp/final.json > /tmp/final.md

          if ! jq -e '.labels | any(.name == "eren-onayli")' \
            /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryo Eren tarafından onaylanmamış."
            exit 1
          fi

          if ! jq -e '.labels | any(.name == "cekime-hazir")' \
            /tmp/final.json > /dev/null; then
            echo "Kaynak Nihai Senaryo çekime hazır değil."
            exit 1
          fi

          SOURCE_SHA=$(cat /tmp/final.md /tmp/editing.md \
            | sed '/<!--/,/-->/d' \
            | sha256sum \
            | awk '{print $1}')

          if [[ "$TEST_MODE" == "true" ]]; then
            SUBTITLE_TITLE="TEST Altyazı Paketi - Kurgu Paketi #$EDITING_NUMBER"
          else
            SUBTITLE_TITLE="Altyazı Paketi - Kurgu Paketi #$EDITING_NUMBER"
          fi

          EXISTING_NUMBER=$(gh issue list \
            --state all \
            --search "\"$SUBTITLE_TITLE\" in:title" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$SUBTITLE_TITLE\") | .number" \
            | head -n 1)

          SKIP_SUBTITLE=false
          if [[ -n "$EXISTING_NUMBER" ]]; then
            gh issue view "$EXISTING_NUMBER" --json body > /tmp/existing-subtitle.json
            EXISTING_BODY=$(jq -r '.body' /tmp/existing-subtitle.json)
            if grep -Fq "subtitle-source-sha256: $SOURCE_SHA" <<< "$EXISTING_BODY" \
              && grep -Fq "subtitle-package-version: $SUBTITLE_PACKAGE_VERSION" \
                <<< "$EXISTING_BODY"; then
              SKIP_SUBTITLE=true
              echo "Bu kaynaklar için güncel altyazı paketi zaten mevcut: #$EXISTING_NUMBER"
            fi
          fi

          {
            echo "EDITING_URL=$EDITING_URL"
            echo "FINAL_NUMBER=$FINAL_NUMBER"
            echo "FINAL_URL=$FINAL_URL"
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SUBTITLE_TITLE=$SUBTITLE_TITLE"
            echo "EXISTING_NUMBER=$EXISTING_NUMBER"
            echo "SKIP_SUBTITLE=$SKIP_SUBTITLE"
          } >> "$GITHUB_ENV"

      - name: Kaynak kodu al
        if: env.SKIP_SUBTITLE != 'true'
        uses: actions/checkout@v4

      - name: Altyazı hazırlık paketini üret ve doğrula
        if: env.SKIP_SUBTITLE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/build_subtitle_package.py \
            --final /tmp/final.md \
            --editing /tmp/editing.md \
            --output /tmp/subtitle-package.md \
            --final-url "$FINAL_URL" \
            --editing-url "$EDITING_URL" \
            --test-mode "$TEST_MODE"

          if [[ ! -s /tmp/subtitle-package.md ]]; then
            echo "Altyazı hazırlık paketi boş üretildi."
            exit 1
          fi

          if grep -Eq '[0-9]{2}:[0-9]{2}:[0-9]{2}[,.][0-9]{3}[[:space:]]+-->' \
            /tmp/subtitle-package.md; then
            echo "Videosuz pakette yasak zaman kodu bulundu."
            exit 1
          fi

          SECTION_COUNT=$(grep -Ec '^##[[:space:]]+[1-7]\.' /tmp/subtitle-package.md)
          if [[ "$SECTION_COUNT" -ne 7 ]]; then
            echo "Altyazı paketinde tam olarak yedi bölüm bulunmalı; bulunan: $SECTION_COUNT"
            exit 1
          fi

          if ! grep -Fq 'AI kullanımı:** 0 giriş tokenı, 0 çıkış tokenı, 0 web araması' \
            /tmp/subtitle-package.md; then
            echo "Sıfır-token kullanım kaydı eksik."
            exit 1
          fi

          OUTPUT_CHARS=$(wc -c < /tmp/subtitle-package.md)
          echo "SUBTITLE_OUTPUT_CHARS=$OUTPUT_CHARS" >> "$GITHUB_ENV"

          {
            echo "### Altyazı ajanı kullanım özeti"
            echo "- test_mode: $TEST_MODE"
            echo "- ai_input_tokens: 0"
            echo "- ai_output_tokens: 0"
            echo "- web_searches: 0"
            echo "- output_chars: $OUTPUT_CHARS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Altyazı paketini Issue olarak kaydet
        if: env.SKIP_SUBTITLE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "<!-- subtitle-package-version: $SUBTITLE_PACKAGE_VERSION -->"
            echo "<!-- subtitle-source-sha256: $SOURCE_SHA -->"
            echo "<!-- SUBTITLE_USAGE_V1 test=$TEST_MODE input=0 output=0 web_search=0 output_chars=$SUBTITLE_OUTPUT_CHARS -->"
            cat /tmp/subtitle-package.md
          } > /tmp/subtitle-issue-body.md

          gh label create "altyazi-paketi" \
            --color "1D76DB" \
            --description "Zamanlama ve yayın onayı bekleyen altyazı hazırlık paketi" \
            --force

          if [[ "$TEST_MODE" == "true" ]]; then
            gh label create "sistem-testi" \
              --color "BFD4F2" \
              --description "Gerçek üretim kayıtlarını değiştirmeyen sistem testi" \
              --force
            ISSUE_LABELS=("altyazi-paketi" "sistem-testi")
          else
            gh label create "eren-onayi-bekliyor" \
              --color "FBCA04" \
              --description "Yayın öncesi Eren onayını bekliyor" \
              --force
            gh label create "altyazi-paketi-hazir" \
              --color "0E8A16" \
              --description "Altyazı hazırlık paketi tamamlandı" \
              --force
            ISSUE_LABELS=("altyazi-paketi" "eren-onayi-bekliyor")
          fi

          if [[ -n "$EXISTING_NUMBER" ]]; then
            gh issue edit "$EXISTING_NUMBER" \
              --title "$SUBTITLE_TITLE" \
              --body-file /tmp/subtitle-issue-body.md \
              --add-label "${ISSUE_LABELS[0]}" \
              --add-label "${ISSUE_LABELS[1]}"
            SUBTITLE_NUMBER="$EXISTING_NUMBER"
            SUBTITLE_URL=$(gh issue view "$EXISTING_NUMBER" --json url --jq '.url')
          else
            SUBTITLE_URL=$(gh issue create \
              --title "$SUBTITLE_TITLE" \
              --body-file /tmp/subtitle-issue-body.md \
              --label "${ISSUE_LABELS[0]}" \
              --label "${ISSUE_LABELS[1]}")
            SUBTITLE_NUMBER=$(grep -oE '[0-9]+$' <<< "$SUBTITLE_URL")
          fi

          if [[ "$TEST_MODE" == "false" ]]; then
            gh issue edit "$EDITING_NUMBER" --add-label "altyazi-paketi-hazir"
            gh issue comment "$EDITING_NUMBER" \
              --body "💬 Altyazı hazırlık paketi oluşturuldu: $SUBTITLE_URL"
          fi

          {
            echo "### Altyazı hazırlık paketi oluşturuldu"
            echo "- Test modu: $TEST_MODE"
            echo "- Kaynak kurgu paketi: #$EDITING_NUMBER"
            echo "- Kaynak nihai senaryo: #$FINAL_NUMBER"
            echo "- Altyazı paketi: #$SUBTITLE_NUMBER"
            echo "- AI tokenı: 0"
            echo "- Gerçek üretim kayıtları değiştirildi: $([[ "$TEST_MODE" == "true" ]] && echo hayır || echo evet)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Güncel altyazı paketi zaten varsa özeti yaz
        if: env.SKIP_SUBTITLE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SUBTITLE_URL=$(gh issue view "$EXISTING_NUMBER" --json url --jq '.url')
          echo "### Güncel altyazı paketi zaten mevcut" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test modu: $TEST_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kaynak kurgu paketi: #$EDITING_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Paket: $SUBTITLE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI tokenı: 0" >> "$GITHUB_STEP_SUMMARY"
